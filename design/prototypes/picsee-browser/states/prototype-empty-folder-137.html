<body>
<div id="root"></div>

<div class="proto-bar" role="toolbar" aria-label="Prototype switcher">
  <div class="row">
    <button id="prev" aria-label="Previous variant">←</button><span class="label" id="label"></span><button id="next" aria-label="Next variant">→</button>
    <span class="sep"></span>
    <button data-case="subfolders">subfolders</button><button data-case="subfolders-recursive-on">recursive on</button><button data-case="recents">recents</button><button data-case="bare">bare</button>
    <span class="sep"></span>
    <button data-lang="zh">中文</button><button data-lang="en">EN</button>
    <span class="sep"></span>
    <button data-theme="light">Light</button><button data-theme="dark">Dark</button>
  </div>
  <div class="caption" id="caption"></div>
  <div class="state" id="state"></div>
</div>

<script>
// PROTOTYPE switcher. Everything is static markup rebuilt from the URL params; buttons inside the window do nothing.
(() => {
  const VARIANTS = ['A', 'B', 'C'];
  const CASES = ['subfolders', 'subfolders-recursive-on', 'recents', 'bare'];
  const NAMES = { A: 'Switch to grid shell', B: 'Today: generic viewer empty', C: 'Page 22 in the viewer' };
  const CAPTIONS = {
    A: 'A: turning Include Subfolders off leaves nothing to show, so the window switches to the grid shell (sidebar + footer) and shows page 22 there.',
    B: 'B (current build): the viewer stays, the canvas clears, and the viewer shows its generic first-launch empty state while the window title still says Trip.',
    C: 'C: the viewer stays (titlebar + floating controls, no sidebar or grid footer) and renders page 22\'s content on the viewer surface.'
  };

  const ic = {
    folder: (s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /></svg>`,

    open: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v2" /><path d="M3 10h17a1 1 0 0 1 1 1.3l-2 8a2 2 0 0 1-2 1.7H5a2 2 0 0 1-2-2Z" /></svg>`,
    heart: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" /></svg>`,
    clock: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>`,
    chevron: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>`,
    sidebar: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M9 3v18" /></svg>`,
    grid: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></svg>`,
    more: `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.5" /><circle cx="12" cy="12" r="1.5" /><circle cx="19" cy="12" r="1.5" /></svg>`,
    search: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m16 16 5 5" /></svg>`,
    sort: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4v16m-4-4 4 4 4-4M15 5h6m-6 5h4m-4 5h2" /></svg>`,
    info: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11v6m0-10h.01" /></svg>`
  };

  // zh: pinned empty-folder.html + App/Resources/Localizable.xcstrings.
  // en: implementer handoff i185-137 "Owner questions" §3; generic viewer state from the catalog (ViewerStateHost .empty).
  const T = {
    zh: {
      folder: 'Trip',
      subs: ['2024 冲绳', '手机备份', '扫描件'],
      headSubs: n => `这一层没有图片，但有 ${n} 个子文件夹`,
      headEmpty: '这个文件夹还没有可浏览的图片',
      textSubs: '打开一个子文件夹，把子文件夹里的图片一起显示，或把其他文件夹拖到这里。',
      textEmpty: '换一个文件夹继续，或把文件夹拖到这里。',
      recursive: '包含子文件夹浏览', choose: '选择其他文件夹…', recentHead: '最近打开', subMeta: '子文件夹',
      recents: [['Trip', '1分钟前'], ['日本 · 山海之间', '昨天'], ['2024 家庭', '3天前'], ['壁纸', '上周']],
      generic: ['打开一个文件夹，开始浏览', '图片留在本地，按文件夹浏览。', '选择文件夹…', '也可以拖入图片或文件夹'],
      library: '图库', favs: '个人收藏', recentSide: '最近查看', folders: '文件夹', count: '0 张图片',
      showSidebar: '显示侧栏', hideSidebar: '隐藏侧栏', backGrid: '返回网格', moreActs: '更多浏览操作', drop: '内容区：可拖入文件夹打开'
    },
    en: {
      folder: 'Trip',
      subs: ['Okinawa 2024', 'Phone Backup', 'Scans'],
      headSubs: n => `This level has no images, but has ${n} subfolders`,
      headEmpty: 'This folder has no images to browse yet',
      textSubs: 'Open a subfolder, show the images in subfolders too, or drop another folder here.',
      textEmpty: 'Choose another folder to continue, or drop a folder here.',
      recursive: 'Browse Including Subfolders', choose: 'Choose Another Folder…', recentHead: 'Recently Opened', subMeta: 'Subfolder',
      recents: [['Trip', '1 minute ago'], ['Japan · Mountains and Sea', 'yesterday'], ['Family 2024', '3 days ago'], ['Wallpapers', 'last week']],
      generic: ['Open a folder to start browsing', 'Images stay on your Mac. Browse by folder.', 'Choose Folder…', 'You can also drop images or folders here.'],
      library: 'Library', favs: 'Favorites', recentSide: 'Recently Viewed', folders: 'Folders', count: '0 images',
      showSidebar: 'Show Sidebar', hideSidebar: 'Hide Sidebar', backGrid: 'Back to Grid', moreActs: 'More', drop: 'Content area: drop a folder to open it'

  };

  const q = new URLSearchParams(location.search);
  const pick = (k, list, d) => list.includes(q.get(k)) ? q.get(k) : d;
  const s = {
    variant: pick('variant', VARIANTS, 'A'),
    kase: pick('case', CASES, 'subfolders'),
    lang: pick('lang', ['zh', 'en'], 'zh'),
    theme: pick('theme', ['light', 'dark'], 'light')
  };

  function page22(t) {
    const hasSubs = s.kase === 'subfolders' || s.kase === 'subfolders-recursive-on';
    let body;
    if (hasSubs) {
      const tiles = t.subs.map(n => `<button type="button" class="subfolder-tile" aria-label="${n}, ${t.subMeta}">${ic.folder()}<span class="tile-name">${n}</span><span class="tile-meta">${t.subMeta}</span></button>`).join('');
      // recursive already on → the button would do nothing, so it is hidden (handoff owner question 1)
      const primary = s.kase === 'subfolders' ? `<button class="mock-primary">${t.recursive}</button>` : '';
      body = `<h2 id="state-title">${t.headSubs(t.subs.length)}</h2><p id="state-text">${t.textSubs}</p>
        <div class="subfolder-tiles" role="group" aria-label="${t.subMeta}">${tiles}</div>
        <div class="mock-actions">${primary}<button class="text-button">${t.choose}</button></div>`;
    } else {
      const recents = s.kase === 'recents'
        ? `<div class="recent-folders" role="group" aria-labelledby="recent-heading"><div class="recent-heading" id="recent-heading">${t.recentHead}</div>${t.recents.map(([n, w]) => `<button type="button" class="recent-folder">${ic.folder()}<span class="row-text">${n}</span><span class="recent-when">${w}</span></button>`).join('')}</div>`

      body = `<h2 id="state-title">${t.headEmpty}</h2><p id="state-text">${t.textEmpty}</p>${recents}

  function genericEmpty(t) {
    const [h, p, b, m] = t.generic;
    return `<section class="empty-state mock-state">${ic.big}<h2>${h}</h2><p>${p}</p><div class="mock-actions"><button class="mock-primary">${b}</button><span class="mock-muted">${m}</span></div></section>`;
  }

  const titlebar = t => `<header class="titlebar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="titlebar-middle" title="${t.folder}">${ic.folder(14)}<span>${t.folder}</span></div></header>`;

  function gridShell(t) {
    const hasSubs = s.kase === 'subfolders' || s.kase === 'subfolders-recursive-on';
    const children = hasSubs ? `<div class="folder-children">${t.subs.map(n => `<button type="button" class="ds-nav-row">${ic.folder()}<span class="row-text">${n}</span></button>`).join('')}</div>` : '';
    return `<div class="prototype-shell layout-exploration variant-immersive is-grid" style="--picsee-sidebar-width: 196px;">${titlebar(t)}
      <div class="workspace"><aside class="sidebar">
        <button class="sidebar-heading library-toggle" aria-expanded="true">${t.library}${ic.chevron}</button>
        <button type="button" class="ds-nav-row">${ic.heart}<span class="row-text">${t.favs}</span><span class="row-count">3</span></button>
        <button type="button" class="ds-nav-row">${ic.clock}<span class="row-text">${t.recentSide}</span><span class="row-count">1</span></button>
        <div class="sidebar-heading folder-heading"><span>${t.folders}</span></div>
        <div id="folder-tree"><button type="button" class="ds-nav-row" aria-current="page">${ic.open}<span class="row-text">${t.folder}</span><span class="row-count">0</span></button>${children}</div>
      </aside>
      <main class="main-content"><div class="browser-body">${page22(t)}</div></main></div>
      <footer class="grid-bottom-bar"><div class="grid-bottom-left"><button type="button" class="ds-icon-button" aria-label="${t.hideSidebar}" aria-pressed="true">${ic.sidebar}</button><span class="toolbar-divider"></span>
        <div class="grid-file-status"><span>—</span><span class="grid-folder-count">${t.count}</span></div></div>
        <div class="grid-toolbar-tools"><button type="button" class="ds-icon-button" disabled>${ic.search}</button><button type="button" class="ds-icon-button" disabled>${ic.sort}</button><button type="button" class="ds-icon-button" disabled>${ic.info}</button><button type="button" class="ds-icon-button">${ic.grid}</button></div></footer></div>`;
  }

  function viewerShell(t, inner) {
    return `<div class="prototype-shell layout-exploration variant-immersive is-viewing proto-viewer" style="--picsee-sidebar-width: 196px;">${titlebar(t)}
      <div class="workspace sidebar-hidden"><main class="main-content"><div class="picture-viewer chrome-awake"><div class="picture-surface">
        <div class="picture-stage" tabindex="0">${inner}
          <div class="viewer-floating-controls"><div class="leading-pod" data-viewer-controls="leading">
            <button type="button" class="ds-icon-button" aria-label="${t.showSidebar}" title="${t.showSidebar}" aria-pressed="false">${ic.sidebar}</button>
            <button type="button" class="ds-icon-button" aria-label="${t.backGrid}" title="${t.backGrid}">${ic.grid}</button>
            <span class="more-button-wrap"><button type="button" class="ds-icon-button" aria-label="${t.moreActs}" title="${t.moreActs}">${ic.more}</button></span>
          </div></div>
        </div></div></div></main></div></div>`;
  }

  function render() {
    const t = T[s.lang];
    document.documentElement.className = s.theme === 'dark' ? 'theme-dark' : 'theme-light';
    document.documentElement.lang = s.lang === 'zh' ? 'zh-CN' : 'en';
    const root = document.getElementById('root');
    root.innerHTML = s.variant === 'A' ? gridShell(t) : s.variant === 'B' ? viewerShell(t, genericEmpty(t)) : viewerShell(t, page22(t));
    const drop = root.querySelector('[data-drop-target]');
    if (drop) {
      if (q.get('drag') === 'over') drop.classList.add('is-drag-over');
      ['dragenter', 'dragover'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('is-drag-over'); }));
      ['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('is-drag-over'); }));
    }
    document.getElementById('label').textContent = `${s.variant} (${NAMES[s.variant]})`;
    const caseNote = s.variant === 'B' ? ' Sub-cases do not apply: B never shows page 22.' : '';
    document.getElementById('caption').textContent = CAPTIONS[s.variant] + caseNote;
    document.getElementById('state').textContent =
      `variant=${s.variant}  case=${s.variant === 'B' ? '(n/a)' : s.kase}  lang=${s.lang}  theme=${s.theme}  ·  scenario: viewer of "Trip" (3 subfolders, 0 images at its level), Include Subfolders on → off`;
    document.querySelectorAll('[data-case]').forEach(b => { b.classList.toggle('on', b.dataset.case === s.kase); b.disabled = s.variant === 'B'; });
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === s.lang));
    document.querySelectorAll('[data-theme]').forEach(b => b.classList.toggle('on', b.dataset.theme === s.theme));
    const u = new URLSearchParams(location.search);
    u.set('variant', s.variant); u.set('case', s.kase); u.set('lang', s.lang); u.set('theme', s.theme);
    try { history.replaceState(null, '', '?' + u.toString()); } catch (_) { /* some file:// contexts refuse */ }
  }

  const cycle = d => { s.variant = VARIANTS[(VARIANTS.indexOf(s.variant) + d + VARIANTS.length) % VARIANTS.length]; render(); };
  document.getElementById('prev').onclick = () => cycle(-1);
  document.getElementById('next').onclick = () => cycle(1);
  document.querySelectorAll('[data-case]').forEach(b => b.onclick = () => { s.kase = b.dataset.case; render(); });
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { s.lang = b.dataset.lang; render(); });
  document.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => { s.theme = b.dataset.theme; render(); });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
    if (e.key === 'ArrowLeft') cycle(-1);
    if (e.key === 'ArrowRight') cycle(1);
  });
  render();
})();
</script>
</body></html>
