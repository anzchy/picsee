<!doctype html>
<!--
  picsee user journeys (wireflow). A view of the journey index in docs/PICSEE_DEVELOPMENT_PLAN.md §1.6, which is normative
  (ADR-013); when the two disagree, §1.6 wins and this page is fixed. Every card is a live, scaled iframe of a state page
  in manifest.json; cards never point at prototype files. Implementation progress is not shown here: it lives in
  docs/feature-ledger.md. Main steps run left to right and are the success path; "▶ 播放主路径" plays only them. Branches
  hang below a step, are played on their own, and each one declares where it returns (the dashed ↩ edge).
  Works over HTTP (npm run preview:states); from file:// titles come from the fallback list.
-->
<html lang="zh-CN" class="theme-light">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picsee · 用户旅程</title>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: var(--font-size-ui)/1.45 var(--font-sans); background: var(--color-surface); color: var(--color-text); -webkit-font-smoothing: antialiased; }

               color: var(--color-text); background: var(--color-bg); border: 1px solid var(--color-border); }
  header.top nav a:hover { background: var(--color-hover); }
  main { padding: 8px 24px 80px; max-width: 1680px; margin: 0 auto; }
  :focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 16px 0 4px; color: var(--color-muted); font-size: var(--font-size-ui-sm); }
  .legend i { display: inline-block; width: 28px; vertical-align: middle; margin-right: 6px; border-top: 2px solid var(--color-text); }

  section.journey { margin-top: 28px; padding: 20px 22px 22px; border-radius: var(--radius-popover); background: var(--color-bg); box-shadow: var(--shadow-soft); scroll-margin-top: 70px; }
  .jhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .jhead h2 { margin: 0; font-size: var(--font-size-title); }
  .jhead .no { font-family: var(--font-mono); color: var(--color-muted); font-size: var(--font-size-ui-sm); }

  .branch .down span { position: relative; z-index: 1; background: var(--color-bg); padding: 1px 6px; font-size: var(--font-size-ui-sm); color: var(--color-muted); max-width: 240px; text-align: center; }
  .branch.loop .down::before { border-left-color: var(--color-accent); }
  .branch .edge { width: 256px; padding: 8px 10px; border-radius: var(--radius-control); border: 1px dashed var(--color-border); font-size: var(--font-size-ui-sm); color: var(--color-text); background: var(--color-surface); }

  .ret svg { flex: none; color: var(--color-muted); margin-top: 1px; }
  .ret b { color: var(--color-text); font-weight: 600; }
  .loop-label { margin-top: 18px; font-size: var(--font-size-ui-sm); font-weight: 600; color: var(--color-accent-text); }

  .arrow { flex: none; width: 128px; align-self: flex-start; margin-top: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .arrow .line { width: 100%; height: 2px; background: var(--color-text); position: relative; }
  .arrow .line::after { content: ""; position: absolute; right: -1px; top: -5px; border: 6px solid transparent; border-left: 8px solid var(--color-text); border-right: 0; }
  .arrow .lab { font-size: var(--font-size-ui-sm); text-align: center; line-height: 1.35; color: var(--color-text); padding: 0 6px; }

  .card { width: 256px; flex: none; text-align: left; border: 0; padding: 0; background: none; cursor: pointer; font: inherit; color: inherit; }
  .thumb { width: 256px; height: 160px; position: relative; overflow: hidden; border-radius: var(--radius-control); background: var(--color-surface);
           box-shadow: 0 0 0 1px var(--color-border), 0 6px 18px color-mix(in srgb, var(--color-text) 8%, transparent); transition: box-shadow var(--motion-duration-fast), transform var(--motion-duration-fast); }

  .thumb iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: var(--color-bg); }
  .thumb .shield { position: absolute; inset: 0; }
  .thumb .replaced { position: absolute; left: 6px; top: 6px; right: 6px; z-index: 2; padding: 3px 7px; border-radius: var(--radius-control); font-size: var(--font-size-ui-sm); font-weight: 600;
                     background: color-mix(in srgb, var(--color-banner-unsaved) 22%, var(--color-bg)); color: var(--color-text); box-shadow: 0 1px 3px color-mix(in srgb, var(--color-text) 18%, transparent); }
  .cap { margin-top: 8px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .cap b { font-size: var(--font-size-ui); font-weight: 600; }
  .tag { font-size: var(--font-size-ui-sm); padding: 1px 6px; border-radius: 999px; background: var(--color-surface); color: var(--color-muted); white-space: nowrap; }
  .tag.ledger { font-family: var(--font-mono); background: none; border: 1px solid var(--color-border); }
  .tag.err { background: var(--color-danger-soft); color: var(--color-error-text); }
  .note { font-size: var(--font-size-ui-sm); color: var(--color-muted); margin-top: 2px; max-width: 256px; }
  .variants { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; font-size: var(--font-size-ui-sm); color: var(--color-muted); max-width: 256px; }

  .drafts { margin: 18px 0 0; padding-left: 18px; color: var(--color-muted); font-size: var(--font-size-ui-sm); }

  .drafts code { font-family: var(--font-mono); font-size: var(--font-size-ui-sm); }
  h3.sub { margin: 22px 0 0; font-size: var(--font-size-ui-lg); }

  /* player: a fixed dark stage over the page in both themes */
  .player { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; background: color-mix(in srgb, #000 82%, transparent); color: #fff; }
  .player.open { display: flex; }
  .player .bar { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: #000; font-size: var(--font-size-ui); flex-wrap: wrap; }
  .player .bar b { font-size: var(--font-size-ui-lg); }
  .player .bar .trig, .player .bar .keys { color: #cbd5e1; }
  .player .bar .keys { font-size: var(--font-size-ui-sm); }
  .player .bar .sp { margin-left: auto; }
  .player button { height: 30px; min-width: 30px; padding: 0 10px; border: 0; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; cursor: pointer; font: inherit; }
  .player button:hover { background: rgba(255,255,255,.22); }
  .player button:disabled { opacity: .35; cursor: default; }
  .player a { color: #cbd5e1; }
  .player :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .player .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 18px 18px; }
  .player .frame { position: relative; flex: none; border-radius: var(--radius-popover); overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .player .frame iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
  .player .dots { display: flex; gap: 6px; }
  .player .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.3); }
  .player .dots i.on { background: #fff; }
  @media (prefers-reduced-motion: reduce) { .thumb { transition: none; } .card:hover .thumb, .card:focus-visible .thumb { transform: none; } }
</style>
</head>

<header class="top">
  <strong>picsee · 用户旅程</strong>
  <span class="meta" id="meta"></span>
  <nav id="jnav" aria-label="旅程"></nav>
</header>
<main>
  <div class="legend">
    <span><i></i>主路径（成功路径；箭头上是触发方式）</span>
    <span><i class="dash"></i>支线：空态、异常或可选动作，各自写明回到哪里（↩）</span>
    <span><span class="tag">P2-08b #137</span>工作包与 issue（计划 §1.3、§1.6）</span>
    <span><span class="tag ledger">FOLDER-08</span>功能账簿行；实现进度只看账簿，本页不显示</span>
    <span><kbd>⌘F</kbd> App 快捷键（DESIGN.md §6）</span>
    <span>点卡片看大图；“▶ 播放主路径”只走主路径，支线单独播放。播放器里 ← / → 换步、Esc 关闭，这是本页的按键，不是 App 快捷键</span>
  </div>
  <div id="journeys"></div>
</main>

<div class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="p-title" hidden>
  <div class="bar">
    <b id="p-title"></b><span id="p-step" aria-live="polite"></span><span class="trig" id="p-trig"></span>
    <span class="sp"></span><span class="keys">播放器按键：← → 换步 · Esc 关闭</span><span class="dots" id="p-dots" aria-hidden="true"></span>
    <button id="p-prev" aria-label="上一步">←</button><button id="p-next" aria-label="下一步">→</button>
    <a id="p-open" target="_blank" rel="noopener">新窗口打开 ↗</a>
    <button id="p-close" aria-label="关闭播放器">Esc</button>
  </div>
  <div class="stage" id="p-stage"><div class="frame" id="p-frame"></div></div>
</div>

const K = s => s.replace(/\[([^\]]+)\]/g, '<kbd>$1</kbd>');   // [Esc] → App shortcut

const ENTRIES = [

  ['把文件夹拖到 21，或拖到已打开的网格上', 'OPEN-04', '24 读取文件夹 → 11 网格'],

        ] },
    ] },
  { id: 'J2', name: '看图与返回', goal: '打开一张、翻看、看细节，再回到原处', stages: ['当前项', '沉浸查看', '可选：工具 / 1:1 / 胶片条', '返回'],

          { id: 'J2-tools', loop: true, p: 'viewer-controls', t: '移到边缘 / [Tab]', to: '约 2.5 秒无操作后隐藏，回到 13', toPage: 'viewer-quiet' },
          { id: 'J2-actual', loop: true, p: 'original-size', t: '[1] 原始尺寸', to: '[0] 适应窗口，回到 13', toPage: 'viewer-quiet' },
          { id: 'J2-film', loop: true, p: 'viewer-filmstrip', t: '展开胶片条（J2 加厚）', to: '收起胶片条，回到 13', toPage: 'viewer-quiet' },
        ] },
    ],
    end: { p: 'grid-light', t: '[Esc] 或 [Space] 回到网格<br>保留选择与滚动位置', note: '[Esc] 先关闭菜单、Inspector 等弹出层，再回网格（DESIGN.md §6）' } },
  { id: 'J3', name: '找图与操作', goal: '缩小范围，选中几张，对它们做事', stages: ['筛选', '多选', '操作'],
    wps: 'P3-10 搜索部分 · P3-09 · P3-12 #144',
    steps: [
      { p: 'grid-light', note: '浏览当前文件夹',
        branches: [{ id: 'J3-search', p: 'search-empty', t: '[⌘F] 搜索，没有结果', to: '清除搜索 → 11，恢复内容与合理当前项', toPage: 'grid-light' }] },
      { p: 'grid-multiselect', t: '[⌘] 点击切换<br>[Shift] 范围选择', note: '选择集合、当前项、锚点是三种状态' },
      { p: 'grid-context-menu', t: '右键 / 菜单键', note: '五个基础动作；[Esc] 关闭并回到触发处',
        branches: [
          { id: 'J3-quicklook', t: '快速查看', to: '13 大图（<a href="#J2">J2</a>）；[Esc] 回网格' },
          { id: 'J3-finder', t: '在访达中显示', to: '访达打开并选中该文件；回到 picsee 时网格不变（GRID-10）' },
          { id: 'J3-copy', t: '拷贝路径', to: '菜单关闭，焦点回到触发处（GRID-11）' },
          { id: 'J3-favourite', t: '收藏', to: '侧栏「个人收藏」多一项（GRID-12，<a href="#J4">J4</a>）' },
          { id: 'J3-info', t: '图片信息', to: '16 / 34 Inspector（<a href="#J4">J4</a>）；[Esc] 先关闭 Inspector' },
        ] },
    ] },
  { id: 'J4', name: '信息与偏好', goal: '看真实元数据，按喜好改外观，回到收藏与最近查看', stages: ['查看信息', '调整显示', '收藏与最近'],
    wps: 'P3-13 · #193 · P3-11 #114 · P3-14 #115',
    steps: [
      { p: 'viewer-controls', note: '大图工具显示时' },
      { p: 'viewer-inspector', t: '图片信息按钮<br>或右键「图片信息」', note: '读不到的显示“未知”；[Esc] 先关闭 Inspector',
        branches: [{ id: 'J4-light', p: 'viewer-inspector-light', t: '浅色外观下的同一面板', to: '随主题切换，不另有布局；回到 16', toPage: 'viewer-inspector' }] },
      { p: 'grid-display', t: '[Esc] 关闭 Inspector，回网格<br>点底部「显示」', note: '主题、密度、文件名、裁剪；立即生效。深色网格见参考页 12' },
    ],
    end: { p: 'grid-light', t: '[Esc] 或点面板外<br>关闭面板', note: '设置保留；侧栏可进入收藏与最近查看',
      branches: [{ id: 'J4-library', ph: ['个人收藏 / 最近查看', '还没有状态稿。点侧栏「个人收藏」或「最近查看」，网格只显示这些图片（GRID-12、GRID-17，P3-14 #115）。'],
                   t: '点侧栏「个人收藏」/「最近查看」', to: '点侧栏里的文件夹 → 11；来自失效文件夹的图片 → 26', toPage: 'grid-light' }] } },
];
const REF = { pages: ['grid-dark', 'keyboard-focus', 'compact-grid', 'components'],
  note: '这些页面不是某一步，而是每条旅程都要满足的约束：深色外观、键盘焦点、小窗口布局和组件状态（计划 §1.6）。' };
const DRAFTS = [
  '21 原稿：<code>first-launch.html</code>。J1 主路径仍用它的卡片，外观以 P3-16 的 B4 为准；B4 落地后替换这一页。',
  '22 原稿（22-A，页内居中提示）：已由 <code>empty-folder.html</code>（22-BD）替换；旧稿见 git 历史 <code>1c9346d:design/prototypes/picsee-browser/states/empty-folder.html</code>。',
  '26 原稿（26-A，页内居中提示）：已由 <code>permission-denied.html</code>（26-BC）替换；旧稿见 <code>1c9346d:design/prototypes/picsee-browser/states/permission-denied.html</code>。',
  '22、26 的其他候选（22-0/B/C/D、26-0/A/B/C/D、26M-A/B）只在分支 <code>prototype/states-22-26</code> 的原型里，不进 main（ADR-014）。',
];

let INFO = {};
const info = n => INFO[n] || { title: n, w: 1280, h: 800 };
const srcOf = (n, q) => n + '.html' + (q ? '?' + q : '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plain = s => s.replace(/<[^>]+>/g, ' ').replace(/\[([^\]]+)\]/g, '$1').replace(/\s+/g, ' ').trim();
const RET = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2" stroke-linecap="round" aria-hidden="true"><path d="M20 18v-6a4 4 0 0 0-4-4H5"/><path d="m9 4-4 4 4 4"/></svg>';

function card(n, q, note, extra) {
  const i = info(n), s = 256 / i.w, h = Math.round(i.h * s);
  const tags = (WP[n] ? `<span class="tag">${WP[n]}</span>` : '') + (LEDGER[n] ? `<span class="tag ledger">${LEDGER[n]}</span>` : '') + (extra || '');
  const replaced = REPLACED[n] && !q ? `<span class="replaced">替换稿：${esc(REPLACED[n])}</span>` : '';
  return `<button class="card" data-page="${n}"${q ? ` data-query="${esc(q)}"` : ''} aria-label="${esc(i.title)}${q ? '（' + esc(q) + '）' : ''}，查看大图">
    <div class="thumb" style="height:${Math.min(h, 200)}px">${replaced}<iframe loading="lazy" tabindex="-1" aria-hidden="true" src="${srcOf(n, q)}" style="width:${i.w}px;height:${i.h}px;transform:scale(${s})"></iframe><div class="shield"></div></div>
    <div class="cap"><b>${esc(i.title)}</b>${tags}</div>${note ? `<div class="note">${K(note)}</div>` : ''}</button>`;
}
function arrow(t) { return `<div class="arrow"><div class="lab">${K(t || '')}</div><div class="line"></div></div>`; }
function branch(b, from) {
  const body = b.p ? card(b.p, b.q, '', b.p === 'image-error' || (b.p === 'permission-denied' && !b.q) ? '<span class="tag err">异常</span>' : '')
    : b.ph ? `<div class="edge placeholder"><b>${esc(b.ph[0])}</b><span>${esc(b.ph[1])}</span></div>` : '';
  const variants = (b.variants || []).map(([q, label]) => `<button data-page="${b.p}" data-query="${esc(q)}">${esc(label)}</button>`).join('');
  const playable = b.p && b.toPage;
  return `<div class="branch${b.loop ? ' loop' : ''}" data-branch="${b.id}" data-to="${esc(plain(b.to))}">
    <div class="down"><span>${b.loop ? '可选 · ' : ''}${K(b.t)}</span></div>${body}
    ${variants ? `<div class="variants">其他情况：${variants}</div>` : ''}
    <div class="ret">${RET}<span><b>回到</b> ${K(b.to)}</span></div>
    ${playable ? `<button class="bplay" data-play-branch="${b.id}" data-from="${from}">▶ 播放这条支线</button>` : ''}</div>`;
}
function column(p, note, branches) {
  const loops = branches.filter(b => b.loop), rest = branches.filter(b => !b.loop);
  return `<div class="col">${card(p, '', note)}${rest.map(b => branch(b, p)).join('')}`
    + (loops.length ? `<div class="loop-label">可选，可反复（不是必经步骤）</div>${loops.map(b => branch(b, p)).join('')}` : '') + '</div>';
}
const mainPath = j => j.steps.map(s => s.p).concat(j.end ? [j.end.p] : []);
const allBranches = j => j.steps.concat(j.end ? [j.end] : []).flatMap(s => s.branches || []);

function render() {
  const used = new Set();
  const mark = s => { used.add(s.p); (s.branches || []).forEach(b => b.p && used.add(b.p)); };
  const entry = `<section class="journey" id="ENTRY"><div class="jhead"><span class="no">入口</span><h2>从哪里进入</h2><span class="goal">每个入口落到哪一步（计划 §1.6，账簿 OPEN-*、ACCESS-01）</span></div>
    <table class="entries"><thead><tr><th>用户做了什么</th><th>账簿</th><th>落到</th></tr></thead><tbody>${ENTRIES.map(([a, id, to]) => `<tr><td>${K(a)}</td><td class="id">${id}</td><td>${K(to)}</td></tr>`).join('')}</tbody></table></section>`;
  const out = [entry].concat(JOURNEYS.map(j => {
    const parts = j.steps.map((s, k) => { mark(s); return (k ? arrow(s.t) : '') + column(s.p, s.note, s.branches || []); }).join('')
      + (j.end ? (mark(j.end), arrow(j.end.t) + column(j.end.p, j.end.note, j.end.branches || [])) : '');
    return `<section class="journey" id="${j.id}" data-main='${JSON.stringify(mainPath(j))}'><div class="jhead"><span class="no">${j.id}</span><h2>${j.name}</h2><span class="goal">目标：${j.goal}</span>
      <button class="play" data-play="${j.id}">▶ 播放主路径</button><span class="wps">工作包：${j.wps}</span></div>
      <div class="stages">${j.stages.map(s => `<span>${s}</span>`).join('<span class="sep">→</span>')}</div>
      <div class="flow">${parts}</div></section>`;
  }));
  REF.pages.forEach(n => used.add(n));
  const loose = Object.keys(INFO).filter(n => !used.has(n));
  out.push(`<section class="journey" id="REF"><div class="jhead"><span class="no">REF</span><h2>参考页与旧稿</h2><span class="goal">${REF.note}</span></div>
    <div class="ref">${REF.pages.map(n => card(n, '', '')).join('')}${loose.map(n => card(n, '', '⚠ 还没挂到任何旅程')).join('')}</div>
    <h3 class="sub">旧稿（不是用户步骤）</h3><ul class="drafts">${DRAFTS.map(d => `<li>${d}</li>`).join('')}</ul></section>`);
  document.getElementById('journeys').innerHTML = out.join('');
  document.getElementById('jnav').innerHTML = `<a href="#ENTRY">入口</a>` + JOURNEYS.map(j => `<a href="#${j.id}">${j.id} ${j.name}</a>`).join('') + `<a href="#REF">参考页</a><a href="index.html">逐页索引</a>`;
  document.getElementById('meta').textContent = `${JOURNEYS.length} 条旅程 · 覆盖 ${[...used].filter(n => INFO[n]).length}/${Object.keys(INFO).length} 份状态稿 · 实现进度见功能账簿`;
}

// player: a modal dialog; focus stays inside while open and returns to the opener on close.
let seq = [], at = 0, opener = null;
const P = id => document.getElementById(id);
function show() {
  const { p, q, t } = seq[at], i = info(p);
  P('player').dataset.page = p;
  P('p-step').textContent = `${at + 1} / ${seq.length} · ${i.title}${q ? '（' + q + '）' : ''}`; P('p-trig').textContent = t ? '← ' + plain(t) : '';
  P('p-dots').innerHTML = seq.map((_, k) => `<i class="${k === at ? 'on' : ''}"></i>`).join('');
  P('p-prev').disabled = at === 0; P('p-next').disabled = at === seq.length - 1; P('p-open').href = srcOf(p, q);
  const st = P('p-stage').getBoundingClientRect(), sc = Math.min((st.width - 36) / i.w, (st.height - 18) / i.h, 1);
  P('p-frame').style.width = i.w * sc + 'px'; P('p-frame').style.height = i.h * sc + 'px';
  P('p-frame').innerHTML = `<iframe tabindex="-1" title="${esc(i.title)}" src="${srcOf(p, q)}" style="width:${i.w}px;height:${i.h}px;transform:scale(${sc})"></iframe>`;
}
function open(list, title, from) {
  seq = list; at = 0; opener = from; P('p-title').textContent = title;
  P('player').hidden = false; P('player').classList.add('open'); show(); (P('p-next').disabled ? P('p-close') : P('p-next')).focus();
}
function close() { P('player').classList.remove('open'); P('player').hidden = true; P('p-frame').innerHTML = ''; if (opener) opener.focus(); }
// Success path only: the main steps and the closing step. Branches are never inlined.
const journeySeq = j => j.steps.map((s, k) => ({ p: s.p, t: k ? s.t : '起点' })).concat(j.end ? [{ p: j.end.p, t: j.end.t }] : []);
const branchSeq = (b, from) => [{ p: from, t: '起点' }, { p: b.p, q: b.q, t: b.t }, { p: b.toPage, t: '↩ ' + b.to }];
document.addEventListener('click', e => {
  const pl = e.target.closest('[data-play]');
  if (pl) { const j = JOURNEYS.find(x => x.id === pl.dataset.play); return open(journeySeq(j), `${j.id} ${j.name} · 主路径`, pl); }
  const bp = e.target.closest('[data-play-branch]');
  if (bp) { const id = bp.dataset.playBranch, j = JOURNEYS.find(x => allBranches(x).some(b => b.id === id)), b = allBranches(j).find(x => x.id === id);
            return open(branchSeq(b, bp.dataset.from), `${j.id} 支线 · ${plain(b.t)}`, bp); }
  const c = e.target.closest('[data-page]');
  if (c && !c.closest('#player')) open([{ p: c.dataset.page, q: c.dataset.query || '', t: '' }], info(c.dataset.page).title, c);
});
P('p-prev').onclick = () => { if (at > 0) { at--; show(); } };
P('p-next').onclick = () => { if (at < seq.length - 1) { at++; show(); } };
P('p-close').onclick = close;
document.addEventListener('keydown', e => {
  if (P('player').hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); close(); }
  else if (e.key === 'ArrowLeft') P('p-prev').click();
  else if (e.key === 'ArrowRight') P('p-next').click();
  else if (e.key === 'Tab') {
    const f = [...P('player').querySelectorAll('button, a[href]')].filter(x => !x.disabled);
    const i = f.indexOf(document.activeElement), n = f.length;
    e.preventDefault(); f[(i + (e.shiftKey ? n - 1 : 1) + n) % n].focus();
  }
});
addEventListener('resize', () => { if (!P('player').hidden) show(); });

fetch('manifest.json').then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(m => { m.states.forEach(s => INFO[s.name] = { title: s.title, w: s.viewport.width, h: s.viewport.height }); })
  .catch(() => { Object.entries(FALLBACK).forEach(([n, [title, w, h]]) => INFO[n] = { title, w, h }); })
  .finally(render);
</script>
</body>
