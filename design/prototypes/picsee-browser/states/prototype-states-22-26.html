<style>
  * { box-sizing: border-box; }

  /* window shell, after states/empty-folder.html */

            box-shadow: 0 0 0 .5px rgba(0,0,0,.25), 0 22px 60px rgba(0,0,0,.28); display: grid; grid-template: 38px 1fr 40px / 196px 1fr; }
  .embed .window { width: 100vw; height: 100vh; }

  .sb-row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: var(--radius-control); font-size: 13px; }
  .sb-row .n { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--color-muted); }
  .sb-row.sel { background: var(--color-accent-soft); color: var(--color-accent-text); }
  .sb-row.sub { padding-left: 28px; }
  .sb-row.dim { color: var(--color-muted); }
  .sb-row .warn { color: var(--color-banner-unsaved); margin-left: auto; }
  .sb-row svg { flex: none; }
  .main { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }

  /* shared empty-state pieces */
  .es { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; max-width: 520px; }
  .es .icon { color: var(--color-muted); }

  .btn { height: 30px; padding: 0 14px; border-radius: var(--radius-control); border: 0; cursor: pointer; background: var(--color-accent-fill); color: var(--color-on-accent); font-weight: 600; }
  .btn:hover { background: var(--color-accent-fill-hover); }
  .btn2 { height: 30px; padding: 0 12px; border-radius: var(--radius-control); border: 1px solid var(--color-border); background: var(--color-bg); cursor: pointer; }
  .btn2:hover { background: var(--color-hover); }
  .link { border: 0; background: none; color: var(--color-accent-text); cursor: pointer; padding: 0 4px; }
  .btn:focus-visible, .btn2:focus-visible, .link:focus-visible, .tile:focus-visible, .rrow:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }

  /* 22-B subfolder tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, 150px); gap: 14px; margin-top: 10px; }
  .tile { border: 1px solid var(--color-border); background: var(--color-bg); border-radius: 10px; padding: 14px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; }
  .tile:hover { background: var(--color-hover); }
  .tile .fn { font-weight: 600; } .tile .meta { font-size: 12px; color: var(--color-muted); }

  /* 22-D recents */
  .recent { width: 380px; margin-top: 10px; border: 1px solid var(--color-border); border-radius: 10px; overflow: hidden; text-align: left; }
  .recent .rh { font-size: 12px; color: var(--color-muted); padding: 8px 12px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
  .rrow { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: var(--color-bg); padding: 9px 12px; cursor: pointer; text-align: left; }
  .rrow + .rrow { border-top: 1px solid var(--color-border-subtle); }
  .rrow:hover { background: var(--color-hover); }
  .rrow .when { margin-left: auto; font-size: 12px; color: var(--color-muted); }
  .dropzone { position: absolute; inset: 18px; border: 1.5px dashed transparent; border-radius: 14px; transition: border-color var(--motion-duration-fast), background var(--motion-duration-fast); pointer-events: none; }
  .main.over .dropzone { border-color: var(--color-accent); background: var(--color-accent-soft); }

  /* 0: native sheet */
  .sheet-scrim { position: absolute; inset: 38px 0 0 0; }
  .sheet { position: absolute; top: 38px; left: 50%; transform: translateX(-50%); width: 300px; background: var(--color-panel); border-radius: 0 0 12px 12px;
           box-shadow: 0 14px 40px rgba(0,0,0,.25), 0 0 0 .5px var(--color-border); padding: 20px 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; z-index: 5; }
  .sheet .appicon { width: 54px; height: 54px; border-radius: 12px; background: linear-gradient(140deg, #3b82f6, #1e40af); display: grid; place-items: center; color: #fff; font-weight: 700; }
  .sheet b { font-size: 13px; } .sheet p { margin: 0; font-size: 11.5px; color: var(--color-muted); }
  .sheet .sbtn { width: 100%; height: 26px; border-radius: 6px; border: 0; background: var(--color-hover); cursor: pointer; font-size: 12.5px; }
  .sheet .sbtn.pri { background: var(--color-accent-fill); color: var(--color-on-accent); }
  .blank-msg { color: var(--color-muted); }

  /* 26-C cause tabs */
  .causes { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--color-surface); border: 1px solid var(--color-border); margin-bottom: 14px; }
  .causes button { border: 0; background: none; height: 26px; padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--color-muted); }
  .causes button.on { background: var(--color-bg); color: var(--color-text); box-shadow: 0 0 0 .5px var(--color-border), 0 1px 2px rgba(0,0,0,.08); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-muted); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--color-banner-unsaved); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .live i { animation: none; } }
  /* 26-D steps */
  .steps { display: grid; grid-template-columns: repeat(3, 170px); gap: 14px; margin-top: 12px; text-align: left; }
  .step { border: 1px solid var(--color-border); border-radius: 10px; padding: 12px; background: var(--color-bg); }
  .step .k { font-family: var(--font-mono); font-size: 11px; color: var(--color-accent-text); }
  .step .t { font-weight: 600; margin: 4px 0; } .step .d { font-size: 12px; color: var(--color-muted); line-height: 1.5; }
  .crumb { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--color-surface); margin-top: 6px; }

  /* 26m moved/renamed */
  .gridv { position: absolute; inset: 0; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 12px; align-content: start; overflow: hidden; }
  .gridv.banner-on { top: 44px; }
  .gridv .cell { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--color-muted); }
  .gridv .th { aspect-ratio: 4 / 3; border-radius: 8px; }
  .gridv .cell span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quiet { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px;
           border-radius: var(--radius-popover); background: var(--color-panel); box-shadow: var(--shadow-soft); font-size: 12px; white-space: nowrap; }
  .banner { position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 6; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px;
            background: var(--color-accent-soft); border-bottom: 1px solid var(--color-border); font-size: 12.5px; }
  .banner .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { border: 0; background: none; width: 22px; height: 22px; border-radius: 6px; cursor: pointer; color: var(--color-muted); }
  .x:hover { background: var(--color-hover); }
  .toast { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 20; padding: 8px 14px; border-radius: var(--radius-popover);
           background: var(--color-panel); box-shadow: var(--shadow-soft); font-size: 12px; opacity: 0; transition: opacity var(--motion-duration-fast); pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>

const I = {

  grid: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg>',

const PAGES = {
  '22': { name: '空文件夹', variants: {

        <div class="tiles">${SUBS.map(([n]) => `<button class="tile" data-say="进入子文件夹 “${n}”"><span class="fi">${I.folder}</span><span class="fn">${n}</span><span class="meta">子文件夹</span></button>`).join('')}</div>
        <div class="actions"><button class="btn" data-say="开启“包含子文件夹”并重新读取">包含子文件夹浏览</button><button class="link" data-say="弹出系统“打开”面板">选择其他文件夹…</button></div></div>` }],
    '22-C': ['说明原因', '告诉用户这里有什么：找到了哪些不是图片的文件，或者真的什么都没有，让“为什么是空的”一目了然。', '需要扫描时按扩展名统计非图片文件，现在的扫描不统计；数字必须来自真实扫描', { main: () => `<div class="es"><div class="icon">${I.folderBig}</div><h2>这个文件夹里没有 picsee 能打开的图片</h2><p>读取到 14 个其他文件：</p>

        <p style="font-size:12px">picsee 可打开 JPEG、PNG、HEIC、TIFF 等常见图片格式。</p>${A22}</div>` }],
    '22-D': ['换一个文件夹', '空态直接给出最近打开的文件夹（OPEN-06 已有，最多 10 项），一步切走；整个内容区同时是拖放目标，拖入其他文件夹即打开。', '', { drop: true, main: () => `<div class="dropzone"></div><div class="es"><div class="icon">${I.folderBig}</div><h2>这个文件夹还没有可浏览的图片</h2><p>换一个文件夹继续，或把文件夹拖到这里。</p>
        <div class="recent"><div class="rh">最近打开</div>${RECENTS.map(([n, w]) => `<button class="rrow" data-say="打开最近文件夹 “${n}”">${I.folder}<span>${n}</span><span class="when">${w}</span></button>`).join('')}</div>
        <div class="actions"><button class="btn2" data-say="弹出系统“打开”面板">选择其他文件夹…</button></div></div>` }],
  } },
  '26': { name: '目录权限失效', variants: {
    '26-BC': ['定稿：侧栏标记 + 按原因区分', '用户 2026-10-28 选定 B+C：出问题的文件夹在侧栏变灰带 ⚠，收藏和最近查看照常可用；主区按原因给出路：授权失效 → 重新选择；磁盘未连接 → 插上自动恢复；被移走或改名 → 到新位置选择。', '原型上方的分段控件只用于切换三种原因；能否可靠区分原因要在实现前确认', { broken: true, mark: true, cause: true, main: () => causeView(true) }],
    '26-0': ['现状：提示框', '代码现在的做法：弹出“无法访问此文件夹”提示框，三个按钮；取消后窗口里没有任何说明，也没有再次重连的入口。', '对照：@1x 已验证的就是这一版', { sheet: 'access', blank: true, broken: true }],
    '26-A': ['原稿：页内状态', '状态稿 26 页：窗口内居中说明，“重新选择文件夹”为主按钮，“选择其他文件夹”为次要链接。', '', { broken: true, main: () => `<div class="es"><div class="icon">${I.lockBig}</div><h2>无法访问这个文件夹</h2><p>访问权限可能已失效，请重新选择该文件夹。</p><div class="actions"><button class="btn" data-say="弹出“打开”面板，定位到上次的位置">重新选择文件夹…</button><button class="link" data-say="弹出“打开”面板">选择其他文件夹…</button></div></div>` }],
    '26-B': ['侧栏标记 + 其他内容照常', '只有出问题的文件夹在侧栏里带 ⚠ 并变灰，子文件夹收起；收藏和最近查看照常可点，让用户知道“坏的只是这一个”。主区同 26-A。', '收藏/最近里来自该文件夹的图片同样不可用，点开时应走同一个重连页', { broken: true, mark: true, main: () => `<div class="es"><div class="icon">${I.lockBig}</div><h2>无法访问“待整理”</h2><p>访问权限可能已失效。重新选择这个文件夹后，picsee 会回到你刚才的位置。<br>侧栏里的收藏和最近查看不受影响。</p><div class="actions"><button class="btn" data-say="弹出“打开”面板，定位到上次的位置">重新选择文件夹…</button><button class="link" data-say="弹出“打开”面板">选择其他文件夹…</button></div></div>` }],
    '26-C': ['按原因区分', '分清三种原因，各给最合适的出路：授权失效 → 重新选择；外接磁盘未连接 → 插上后自动恢复，无需操作；文件夹被移走或改名 → 到新位置重新选择。', '能否可靠区分要在实现前确认：卷未挂载可由 FOLDER-09 检测，“移走”需要书签解析结果', { broken: true, mark: true, cause: true, main: () => causeView() }],
    '26-D': ['引导式重连', '用三步说明为什么要重新选择（沙盒只允许读取你授权过的文件夹），并告诉用户面板会停在哪、要选哪个。', '面板定位只能“尽量”：系统面板可能不接受上次的位置', { broken: true, main: () => `<div class="es"><div class="icon">${I.lockBig}</div><h2>需要重新允许 picsee 读取“待整理”</h2><p>macOS 只允许 picsee 读取你亲自选择过的文件夹。这个授权已经失效，重新选择一次即可恢复，不会移动或复制任何文件。</p>
        <div class="steps"><div class="step"><div class="k">1</div><div class="t">点“重新选择”</div><div class="d">系统会打开选择面板。</div></div>
        <div class="step"><div class="k">2</div><div class="t">找到这个文件夹</div><div class="d">上次的位置：<br><span class="crumb">${I.folder} 图片 › 待整理</span></div></div>
        <div class="step"><div class="k">3</div><div class="t">点“授权”</div><div class="d">picsee 回到你刚才浏览的位置。</div></div></div>
        <div class="actions"><button class="btn" data-say="弹出“打开”面板，定位到上次的位置">重新选择文件夹…</button><button class="link" data-say="弹出“打开”面板">选择其他文件夹…</button></div></div>` }],
  } },
  '26m': { name: '文件夹被移走或改名', variants: {
    '26M-A': ['自动跟随（账簿现有验收）', 'ACCESS-03 现在的验收：「目录被移动或改名时，最近项直接在新位置浏览」。书签能解析到新位置时直接打开它，标题、侧栏改用新名字，底部给一条不打断的说明，几秒后消失。解析不到（删除、换磁盘）或新位置在废纸篓时，才进入 26 页的“找不到”状态。', '上方分段控件只用于切换三种情况。同一磁盘上的移动和改名，macOS 书签通常能解析到新位置（会标记为需要刷新），这是系统行为，不是 picsee 额外功能', { dyn: () => where === 'moved' ? FOLLOWED : BROKEN, main: () => where === 'moved'
        ? `${GRIDV(false)}<div class="quiet">${I.info}<span>“待整理”已移动或改名，现在在：${NEWPATH}</span><button class="x" aria-label="关闭" data-say="关闭说明">×</button></div><div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:7">${whereSeg()}</div>`
        : LOSTVIEW() }],
    '26M-B': ['先问再打开（26-BC 定稿原样）', '26-BC 定稿里“被移走或改名”的做法：不自动打开，主区说明文件夹不在原位，按钮“在新位置选择…”弹出“打开”面板，由用户自己找到并确认。选这一版需要单独提交，改写 ACCESS-03 的验收。', '用户每次移动或改名都要多一步；面板能否直接停在新位置要实现前确认', { dyn: () => BROKEN, main: () => where === 'trash' ? LOSTVIEW()
        : `<div class="es">${whereSeg()}<div class="icon">${I.movedBig}</div><h2>“待整理”不在原来的位置</h2><p>它可能被移动、改名或移到了废纸篓。在新位置重新选择它即可继续。<br>侧栏里的收藏和最近查看不受影响。</p><div class="actions"><button class="btn" data-say="弹出“打开”面板">在新位置选择…</button><button class="link" data-say="弹出“打开”面板">选择其他文件夹…</button></div></div>` }],
    '26M-C': ['自动跟随 + 提示条', '和 A 一样直接在新位置浏览，但在网格上方留一条提示条，写明旧名字和新位置，并给出“不是这个？选择其他文件夹…”，用户关掉之前一直在。废纸篓和找不到的情况同 A。', '仍满足 ACCESS-03 现有验收（直接在新位置浏览），只多一条可关闭的提示', { dyn: () => where === 'moved' ? FOLLOWED : BROKEN, main: () => where === 'moved'
        ? `<div class="banner">${I.info}<span class="grow">“待整理”已移动或改名，picsee 跟随到了新位置：<b>${NEWPATH}</b></span><button class="link" data-say="弹出“打开”面板">不是这个？选择其他文件夹…</button><button class="x" aria-label="关闭" data-say="关闭提示条">×</button></div>${GRIDV(true)}<div style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:7">${whereSeg()}</div>`
        : LOSTVIEW() }],
  } },
};

const NEWNAME = '2024 已整理', NEWPATH = `图片 › 归档 › ${NEWNAME}`;
let where = 'moved';
const GRIDV = (banner) => `<div class="gridv${banner ? ' banner-on' : ''}">${Array.from({ length: 15 }, (_, i) => `<div class="cell"><div class="th" style="background:linear-gradient(135deg,hsl(${(i * 47) % 360} 35% 62%),hsl(${(i * 47 + 40) % 360} 30% 42%))"></div><span>IMG_${4021 + i}.HEIC</span></div>`).join('')}</div>`;
const LOSTVIEW = () => where === 'trash'
  ? `<div class="es">${whereSeg()}<div class="icon">${I.movedBig}</div><h2>“待整理”在废纸篓里</h2><p>它被移到了废纸篓。picsee 不会自动打开废纸篓里的文件夹。<br>侧栏里的收藏和最近查看不受影响。</p><div class="actions"><button class="btn2" data-say="弹出“打开”面板">选择其他文件夹…</button></div></div>`
  : `<div class="es">${whereSeg()}<div class="icon">${I.movedBig}</div><h2>找不到“待整理”</h2><p>它可能已被删除，或复制到了另一个磁盘。在新位置重新选择它即可继续。<br>侧栏里的收藏和最近查看不受影响。</p><div class="actions"><button class="btn" data-say="弹出“打开”面板">在新位置选择…</button><button class="link" data-say="弹出“打开”面板">选择其他文件夹…</button></div></div>`;
function whereSeg() { return seg('where', [['moved', '同一磁盘上移动或改名'], ['trash', '移到废纸篓'], ['lost', '删除或换了磁盘']], where); }
const FOLLOWED = { title: NEWNAME, fname: NEWNAME, count: '86', status: '86 张图片', subs: true };
const BROKEN = { broken: true, mark: true };

let cause = 'grant';
function causeView(final) {
  const keep = final ? '<br>侧栏里的收藏和最近查看不受影响。' : '';
  const C = {
    grant: [I.lockBig, '无法访问“待整理”', '访问权限已失效。重新选择这个文件夹即可恢复，picsee 会回到你刚才的位置。' + keep, `<button class="btn" data-say="弹出“打开”面板">重新选择文件夹…</button><button class="link" data-say="弹出“打开”面板">选择其他文件夹…</button>`],
    volume: [I.driveBig, '外接磁盘“T7”未连接', '“待整理”在外接磁盘上。重新连接磁盘后，这里会自动恢复，不需要再选择一次。' + keep, `<span class="live"><i></i>等待磁盘连接…</span><button class="link" data-say="弹出“打开”面板">选择其他文件夹…</button>`],
    moved: [I.movedBig, '“待整理”不在原来的位置', '它可能被移动、改名或移到了废纸篓。在新位置重新选择它即可继续。' + keep, `<button class="btn" data-say="弹出“打开”面板">在新位置选择…</button><button class="link" data-say="弹出“打开”面板">选择其他文件夹…</button>`],
  }[cause];
  return `<div class="es">${seg('cause', [['grant', '授权失效'], ['volume', '磁盘未连接'], ['moved', '被移走或改名']], cause)}
    <div class="icon">${C[0]}</div><h2>${C[1]}</h2><p>${C[2]}</p><div class="actions">${C[3]}</div></div>`;
}

function seg(name, opts, on) {
  return `<div class="causes" role="tablist" aria-label="原型切换">${opts.map(([k, n]) => `<button role="tab" aria-selected="${k === on}" class="${k === on ? 'on' : ''}" data-seg="${name}" data-k="${k}">${n}</button>`).join('')}</div>`;
}
const params = new URLSearchParams(location.search);
let hasSubs = params.get('subs') !== '0';
if (['grant', 'volume', 'moved'].includes(params.get('cause'))) cause = params.get('cause');
let page = ['26', '26m'].includes(params.get('page')) ? params.get('page') : '22';
if (['moved', 'trash', 'lost'].includes(params.get('where'))) where = params.get('where');
let cur = params.get('variant');
if (!cur || !PAGES[page].variants[cur]) cur = { '22': '22-BD', '26': '26-BC', '26m': '26M-A' }[page];
let theme = params.get('theme') === 'dark' ? 'dark' : 'light';
const $ = id => document.getElementById(id);

function sidebar(opt) {
  const fname = opt.fname || '待整理';
  const folderRow = opt.blank ? '' : `<div class="sb-h">文件夹</div>
    <div class="sb-row ${opt.mark ? 'dim' : 'sel'}">${I.folder}<span>${fname}</span>${opt.mark ? `<span class="warn" title="无法访问">${I.warn}</span>` : `<span class="n">${opt.broken ? '—' : (opt.count || '0')}</span>`}</div>
    ${!opt.broken && (typeof opt.subs === 'function' ? opt.subs() : opt.subs) ? SUBS.map(([n]) => `<div class="sb-row sub">${I.folder}<span>${n}</span></div>`).join('') : ''}`;
  return `<div class="sb-h" style="margin-top:0">图库</div><div class="sb-row">${I.heart}<span>个人收藏</span><span class="n">3</span></div><div class="sb-row">${I.clock}<span>最近查看</span><span class="n">1</span></div>${folderRow}`;
}
function footer(opt) {
  const status = opt.blank ? '' : (opt.broken ? '无法访问' : (opt.status || '0 张图片'));
  return `<span class="ic">${I.side}</span><span class="vsep"></span><span>${status}</span><span class="right">${[I.search, I.sort, I.info, I.grid].map(i => `<span class="ic dis">${i}</span>`).join('')}</span>`;
}
function render() {
  document.documentElement.className = `theme-${theme}` + (params.has('embed') ? ' embed' : '');
  const v = PAGES[page].variants[cur], base = v[3], opt = base.dyn ? { ...base, ...base.dyn() } : base;
  $('ticon').innerHTML = opt.sheet === 'empty' ? '' : I.folder;
  $('ttext').textContent = opt.sheet === 'empty' ? 'Picsee' : (opt.title || '待整理');
  $('sidebar').innerHTML = sidebar(opt);
  $('footer').innerHTML = footer(opt);
  $('win').style.gridTemplateColumns = opt.blank ? '0 1fr' : '';
  $('sidebar').style.visibility = opt.blank ? 'hidden' : '';
  $('sidebar').style.padding = opt.blank ? '0' : '';
  $('main').className = 'main';
  if (opt.sheet) {
    $('main').innerHTML = `<span class="blank-msg">${opt.sheet === 'empty' ? '' : ''}</span>`;
    const sheet = opt.sheet === 'empty'
      ? `<div class="sheet" role="alertdialog"><div class="appicon">P</div><b>此文件夹没有图片</b><button class="sbtn pri" data-say="关闭提示：窗口停在空白页">好</button></div>`
      : `<div class="sheet" role="alertdialog"><div class="appicon">P</div><b>无法访问此文件夹</b><p>访问权限可能已失效。请重新选择“待整理”。</p><button class="sbtn pri" data-say="弹出“打开”面板">重新选择文件夹…</button><button class="sbtn" data-say="弹出“打开”面板">选择其他文件夹…</button><button class="sbtn" data-say="关闭提示：窗口里不再有任何说明">取消</button></div>`;
    $('main').insertAdjacentHTML('beforeend', sheet);
  } else {
    $('main').innerHTML = opt.main();
  }
  if (opt.drop) $('main').classList.add('droppable');
  $('label').textContent = `${cur} · ${v[0]}`;
  $('cap-title').textContent = `${PAGES[page].name} · ${cur} ${v[0]}`;
  $('cap-desc').textContent = v[1];
  $('cap-note').textContent = v[2] ? '⚠ ' + v[2] : '';
  $('p22').classList.toggle('on', page === '22'); $('p26').classList.toggle('on', page === '26'); $('p26m').classList.toggle('on', page === '26m');
  const p = new URLSearchParams(location.search); p.set('page', page); p.set('variant', cur); p.set('theme', theme); p.delete('subs'); p.delete('cause'); p.delete('where'); if (page === '22') p.set('subs', hasSubs ? '1' : '0'); else if (page === '26') p.set('cause', cause); else p.set('where', where); history.replaceState(null, '', '?' + p);
}
const keys = () => Object.keys(PAGES[page].variants);
const step = k => { const ks = keys(); cur = ks[(ks.indexOf(cur) + k + ks.length) % ks.length]; render(); };
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
$('p22').onclick = () => { page = '22'; cur = '22-BD'; render(); };
$('p26').onclick = () => { page = '26'; cur = '26-BC'; render(); };
$('p26m').onclick = () => { page = '26m'; cur = '26M-A'; render(); };
$('theme').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; render(); };
document.addEventListener('keydown', e => { if (e.target.closest && e.target.closest('.causes')) return; if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
let tt; const say = m => { $('toast').textContent = '（原型）' + m; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 1800); };
document.addEventListener('click', e => {
  const c = e.target.closest('[data-seg]'); if (c) { if (c.dataset.seg === 'cause') cause = c.dataset.k; else if (c.dataset.seg === 'where') where = c.dataset.k; else hasSubs = c.dataset.k === '1'; render(); return; }
  const s = e.target.closest('[data-say]'); if (s) say(s.dataset.say);
});
const main = $('main');
['dragenter', 'dragover'].forEach(ev => main.addEventListener(ev, e => { if (!main.classList.contains('droppable')) return; e.preventDefault(); main.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => main.addEventListener(ev, e => { if (!main.classList.contains('droppable')) return; e.preventDefault(); main.classList.remove('over'); if (ev === 'drop') say('打开拖入的文件夹'); }));
render();
</script>
</body>
</html>
