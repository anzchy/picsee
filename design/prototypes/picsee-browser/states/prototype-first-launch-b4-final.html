<!doctype html>
<!--
  PROTOTYPE — throwaway. Question: "What does the final first-launch screen B4 散落相纸 look like with the
  bundled Unsplash sample photos, across appearance, drag-over, window size and accessibility settings?"
  One design (B4, final per user 2026-10-27), five switches on the floating bar, all mirrored in the URL:
    ?appearance=light|dark &drag=idle|over &size=960x640|800x600|1280x800|1440x900
    &motion=full|reduce &transparency=full|reduce &lang=zh|en   (optional &guides=1 draws the size-rule guides)
  Run: npm run preview:states → http://127.0.0.1:4313/prototype-first-launch-b4-final.html
  Not the native app; nothing is persisted. Photos: assets/b4-samples/ (see its README.md).
-->
<html lang="zh-CN" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picsee · 首次打开 · B4 定稿原型</title>
<link rel="stylesheet" href="_ds/picsee-ui-system/tokens/globals.css">
<link rel="stylesheet" href="_ds/picsee-ui-system/tokens/light.css">
<link rel="stylesheet" href="_ds/picsee-ui-system/tokens/dark.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font-sans); font-size: var(--font-size-ui); color: var(--color-text);
         background: color-mix(in srgb, var(--color-surface) 70%, var(--color-text) 6%);
         display: flex; flex-direction: column; align-items: center; gap: 12px;
         padding: 16px 16px 76px; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; }
  kbd { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: var(--radius-inner);
        border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-muted); }

  /* ---------- prototype chrome (not part of the design) ---------- */
  .proto-head { width: 100%; max-width: 1440px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
                color: var(--color-muted); font-size: 12px; line-height: 1.5; flex: none; }
  .proto-head b { color: var(--color-text); font-size: 14px; }
  .proto-head .rule { max-width: 620px; }
  .readout { font-family: var(--font-mono); font-size: 11px; line-height: 1.55; padding: 8px 10px; border-radius: 8px;
             background: #111; color: #d7dbe2; white-space: pre; flex: none; min-width: 330px; }
  .readout em { font-style: normal; color: #fff; }
  .readout .hid { color: #fbbf24; }
  .stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  .frame { position: relative; flex: none; }
  .proto-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 100; display: flex;
               align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: #111; color: #fff;
               box-shadow: 0 6px 24px rgba(0,0,0,.35); font-size: 12px; white-space: nowrap; max-width: calc(100vw - 16px); overflow-x: auto; }
  .proto-bar .grp { display: flex; align-items: center; gap: 2px; }
  .proto-bar .grp > span { color: #9aa4b2; padding: 0 4px 0 8px; }
  .proto-bar button { border: 0; background: transparent; color: #fff; height: 28px; border-radius: 999px; cursor: pointer; padding: 0 9px; }
  .proto-bar button:hover { background: rgba(255,255,255,.14); }
  .proto-bar button.on { background: rgba(255,255,255,.26); font-weight: 600; }
  .proto-bar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.22); margin: 0 4px; }
  .guide-keep { position: absolute; z-index: 4; border: 1.5px dashed #ef4444; border-radius: 8px; pointer-events: none; display: none; }
  .guide-anchor { position: absolute; z-index: 4; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: #ef4444; display: none; pointer-events: none; }
  .guides .guide-keep, .guides .guide-anchor { display: block; }
  .guides .print.hidden { display: block; opacity: 1 !important; background: none !important; outline: 1.5px dashed #f59e0b; box-shadow: none; }

  /* ---------- the window (design under evaluation) ---------- */
  .window { width: 960px; height: 640px; border-radius: 12px; overflow: hidden; position: absolute; left: 0; top: 0; transform-origin: 0 0;
            background: var(--color-bg); box-shadow: 0 0 0 0.5px rgba(0,0,0,.25), 0 22px 60px rgba(0,0,0,.28);
            display: flex; flex-direction: column; }
  .theme-dark .window { box-shadow: 0 0 0 0.5px rgba(255,255,255,.16), 0 22px 60px rgba(0,0,0,.6); }
  .titlebar { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 600; font-size: 13px;
              position: relative; z-index: 5; color: var(--color-text); }
  .traffic { display: flex; gap: 8px; margin-right: 10px; }
  .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .traffic i:nth-child(1) { background: #ff5f57; } .traffic i:nth-child(2) { background: #febc2e; } .traffic i:nth-child(3) { background: #28c840; }
  .content { flex: 1; min-height: 0; position: relative; display: flex; }
  .bg { position: absolute; left: 0; top: 0; overflow: hidden; z-index: 0; pointer-events: none; }

  /* prints: 5 pt window-bg border, 1 pt hairline, soft shadow, opacity per appearance */
  .print { position: absolute; border-radius: 6px; background-size: cover; background-position: center;
           box-shadow: 0 0 0 5px var(--color-bg), 0 0 0 6px var(--color-border), 0 10px 22px rgba(0,0,0,.14);
           opacity: var(--print-opacity); transition: opacity .45s ease; }
  .theme-dark .print { box-shadow: 0 0 0 5px var(--color-bg), 0 0 0 6px var(--color-border), 0 10px 22px rgba(0,0,0,.45); }
  .print.hidden { display: none; }
  .over .print { opacity: calc(var(--print-opacity) * .4); }

  /* centre: always fully opaque */
  .drop { position: relative; z-index: 2; flex: 1; margin: 0 24px 24px; border: 1.5px dashed transparent; border-radius: 16px;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          transition: background var(--motion-duration-fast), border-color var(--motion-duration-fast); }
  .over .drop { border-color: var(--color-accent); background: var(--color-accent-soft); }
  .centre { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .stack { position: relative; width: 220px; height: 150px; margin-bottom: 30px; }
  .stack .f { position: absolute; inset: 0; border-radius: 10px; background-size: cover; background-position: center;
              box-shadow: 0 0 0 1px var(--color-border), 0 10px 26px rgba(0,0,0,.18); transition: transform .35s ease; }
  .stack .f:nth-child(1) { transform: rotate(-9deg) translate(-36px, 8px); }
  .stack .f:nth-child(2) { transform: rotate(7deg) translate(34px, 6px); }
  .over .stack .f:nth-child(1) { transform: rotate(-14deg) translate(-58px, 10px); }
  .over .stack .f:nth-child(2) { transform: rotate(12deg) translate(56px, 8px); }
  .over .stack .f:nth-child(3) { transform: translateY(-8px) scale(1.04); }
  .drop h1 { margin: 0; font-size: 20px; }
  .sub { display: flex; gap: 12px; align-items: center; color: var(--color-muted); }
  .chips { display: flex; gap: 6px; justify-content: center; }
  .chips span { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--color-group-bg); color: var(--color-muted); }
  .btn { height: 30px; padding: 0 14px; border-radius: var(--radius-control); border: 0; cursor: pointer;
         background: var(--color-accent-fill); color: var(--color-on-accent); font-weight: 600; }
  .btn:hover { background: var(--color-accent-fill-hover); }
  .btn:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
  .toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 20; padding: 8px 14px; border-radius: var(--radius-popover);
           background: var(--color-panel); box-shadow: var(--shadow-soft); font-size: 12px; opacity: 0; transition: opacity var(--motion-duration-fast); pointer-events: none; }
  .toast.show { opacity: 1; }

  /* Reduce Motion: no fan-out, no fade (the dim still applies, instantly) */
  .rm .print, .rm .stack .f, .rm .drop { transition: none; }
  .rm.over .stack .f:nth-child(1) { transform: rotate(-9deg) translate(-36px, 8px); }
  .rm.over .stack .f:nth-child(2) { transform: rotate(7deg) translate(34px, 6px); }
  .rm.over .stack .f:nth-child(3) { transform: none; }
  /* Reduce Transparency: chips and drop area get opaque fills */
  .rt .chips span { background: var(--color-surface); box-shadow: 0 0 0 1px var(--color-border); }
  .rt.over .drop { background: color-mix(in srgb, var(--color-accent) 10%, var(--color-bg)); }
  .rt.over .print { opacity: 0; }   /* the opaque drop fill covers them; also drop the slivers left in the 24 pt margin */
</style>
</head>
<body>
<div class="proto-head">
  <div class="rule"><b>B4 散落相纸 · 定稿效果</b>（原型，可丢弃；6 张相纸用打包候选样图 <code>assets/b4-samples/</code>）<br>
    <span id="rule-text"></span></div>
  <div class="readout" id="readout" aria-live="polite"></div>
</div>
<div class="stage" id="stage">
  <div class="frame" id="frame">
    <div class="window" id="win">
      <div class="bg" id="bg" aria-hidden="true"></div>
      <div class="titlebar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>Picsee</div>
      <div class="content" id="content">
        <div class="drop" id="drop">
          <div class="centre" id="centre">
            <div class="stack" id="stack" aria-hidden="true">
              <div class="f" style="background-image:url(assets/b4-samples/lakehouse.jpg)"></div>
              <div class="f" style="background-image:url(assets/b4-samples/gate.jpg)"></div>
              <div class="f" style="background-image:url(assets/b4-samples/alley.jpg)"></div>
            </div>
            <h1 id="drop-h">把照片文件夹拖到这里</h1>
            <div class="sub"><button class="btn" id="open" data-t="btn"></button><span><span data-t="or"></span> <kbd>⌘O</kbd></span></div>
            <div class="chips"><span data-t="c1"></span><span data-t="c2"></span><span data-t="c3"></span></div>
          </div>
        </div>
        <div class="toast" id="toast"></div>
      </div>
    </div>
  </div>
</div>
<div class="proto-bar" role="toolbar" aria-label="原型状态切换">
  <div class="grp" data-k="appearance"><span>外观</span><button data-v="light">浅色 30%</button><button data-v="dark">深色 40%</button></div>
  <span class="sep"></span>
  <div class="grp" data-k="drag"><span>拖入</span><button data-v="idle">静止</button><button data-v="over">拖入中</button></div>
  <span class="sep"></span>
  <div class="grp" data-k="size"><span>窗口</span><button data-v="960x640">960×640</button><button data-v="800x600">800×600</button><button data-v="1280x800">1280×800</button><button data-v="1440x900">1440×900</button></div>
  <span class="sep"></span>
  <div class="grp" data-k="motion"><span>减少动态</span><button data-v="full">关</button><button data-v="reduce">开</button></div>
  <span class="sep"></span>
  <div class="grp" data-k="transparency"><span>降低透明度</span><button data-v="full">关</button><button data-v="reduce">开</button></div>
  <span class="sep"></span>
  <div class="grp" data-k="lang"><span>语言</span><button data-v="zh">中文</button><button data-v="en">English</button></div>
  <span class="sep"></span>
  <div class="grp" data-k="guides"><button data-v="1" title="显示尺寸规则辅助线">辅助线</button></div>
</div>
<script>
// ---- state (mirrored in the URL) ----
const OPTS = { appearance: ['light', 'dark'], drag: ['idle', 'over'], size: ['960x640', '800x600', '1280x800', '1440x900'],
               motion: ['full', 'reduce'], transparency: ['full', 'reduce'], lang: ['zh', 'en'], guides: ['0', '1'] };
// draft English strings (round 2); the language is independent of appearance
const STR = { zh: { idle: '把照片文件夹拖到这里', over: '松开即可打开', btn: '选择文件夹…', or: '或按', c1: '文件夹', c2: '单张或多张图片', c3: '常见图片格式' },
              en: { idle: 'Drop a photo folder here', over: 'Release to open', btn: 'Choose Folder…', or: 'or press', c1: 'Folder', c2: 'One or more images', c3: 'Common image formats' } };
const qs = new URLSearchParams(location.search);
const S = {};
for (const k in OPTS) S[k] = OPTS[k].includes(qs.get(k)) ? qs.get(k) : OPTS[k][0];
const OPACITY = { light: 30, dark: 40 };          // user decision 2026-10-27
const DIM = 0.4;                                    // drag-over: prints fall to 40% of their opacity over 0.45 s

// ---- size rule ----
// Reference layout is 960×640. Each print is anchored to a corner or an edge midpoint; its gap to that anchor,
// its size and its offset along the edge all scale by s = clamp(min(W/960, H/640), 0.8, 1.25).
// The centre (stack fanned out + title + button + chips) does not scale. A print is hidden when its rotated
// box (incl. 6 pt border) still enters the centre keep-out after being pushed outward (2 pt steps, max 60 pt, ≥75% inside) (centre content + 16 pt, at least 420 pt wide for the fan-out),
// when less than 75% of it is inside the window, or when it covers the traffic lights.
// Below 720×480 all prints are hidden (minimum size; not reachable with the sizes on the bar).
const REF = { w: 960, h: 640, pw: 150, ph: 110 };
const RULE = '尺寸规则：每张相纸锚定到某个角或某条边的中点；尺寸、到锚点的距离、沿边偏移都按 s = clamp(min(W/960, H/640), 0.8, 1.25) 缩放；中央内容不缩放。相纸旋转后的外框（含 6 pt 白边）压到中央留白区（中央内容外扩 16 pt，宽至少 420 pt 以容纳扇开）时，先朝窗口边缘外推，取横向或纵向中较短的一种（左右边只横推，上下边只纵推；每次 2 pt，最多 60 pt，至少 75% 留在窗口内且不盖红绿灯）；仍压到就隐藏。窗口内可见面积不足 75% 或盖住红绿灯，也隐藏。窗口小于 720×480 时全部隐藏。';
// anchor, a, b, rotation. TL/TR/BL/BR: a = gap to the left/right edge, b = gap to the top/bottom edge.
// L/R: a = gap to that edge, b = print-centre offset from the window's vertical middle. T/B: a = centre offset from horizontal middle, b = gap.
// round 2 (user 2026-10-27 「bundle fewer photos」): 6 photos, at most two torii (lakeside, gate), pale ones dropped
const PRINTS = [
  ['TL',  70,   60, -7, 'alley'],
  ['T',  196,   26,  4, 'lakeside'],
  ['R',   30,   26,  8, 'hillside'],
  ['BR', 176,   14, -5, 'gate'],
  ['BL',  52,   30,  6, 'temple'],
  ['L',   26,  -34, -4, 'lakehouse'],
];
const bg = document.getElementById('bg'), win = document.getElementById('win'), frame = document.getElementById('frame');
const els = PRINTS.map(([, , , , n]) => { const p = document.createElement('div'); p.className = 'print';
  p.style.backgroundImage = `url(assets/b4-samples/${n}.jpg)`; bg.append(p); return p; });
const anchorDots = PRINTS.map(() => { const d = document.createElement('div'); d.className = 'guide-anchor'; bg.append(d); return d; });
const keep = document.createElement('div'); keep.className = 'guide-keep'; win.append(keep);

function rotBox(x, y, w, h, deg) {          // axis-aligned box of a rotated rect (+6 pt border)
  const r = Math.abs(deg) * Math.PI / 180, bw = w + 12, bh = h + 12;
  const W2 = (bw * Math.cos(r) + bh * Math.sin(r)) / 2, H2 = (bw * Math.sin(r) + bh * Math.cos(r)) / 2;
  const cx = x + w / 2, cy = y + h / 2; return { l: cx - W2, t: cy - H2, r: cx + W2, b: cy + H2 };
}
const inter = (a, b) => Math.max(0, Math.min(a.r, b.r) - Math.max(a.l, b.l)) * Math.max(0, Math.min(a.b, b.b) - Math.max(a.t, b.t));

function layout(W, H) {
  const s = Math.min(1.25, Math.max(0.8, Math.min(W / REF.w, H / REF.h)));
  const pw = REF.pw * s, ph = REF.ph * s;
  bg.style.width = W + 'px'; bg.style.height = H + 'px';
  // keep-out from the real centre DOM, in window coordinates (window is unscaled in layout terms)
  const c = document.getElementById('centre');
  let l = c.offsetLeft, t = c.offsetTop, w = c.offsetWidth, h = c.offsetHeight;
  for (let n = c.offsetParent; n && n !== win; n = n.offsetParent) { l += n.offsetLeft; t += n.offsetTop; }
  const minW = 420; if (w < minW) { l -= (minW - w) / 2; w = minW; }
  const K = { l: l - 16, t: t - 16, r: l + w + 16, b: t + h + 16 };
  Object.assign(keep.style, { left: K.l + 'px', top: K.t + 'px', width: (K.r - K.l) + 'px', height: (K.b - K.t) + 'px' });
  const traffic = { l: 0, t: 0, r: 84, b: 34 };
  const tooSmall = W < 720 || H < 480;
  const out = [];
  PRINTS.forEach(([a, A, B, rot, name], i) => {
    // place at the anchor; if the print enters the keep-out, push it outward (away from the centre) in 2 pt steps
    // while at least 75% of it stays inside the window; only then hide it
    const place = (k, ax) => {          // k = push in pt; ax = 'x' or 'y' (corners can go either way; edges only outward)
      const gx = (v) => v * s - (ax === 'x' ? k : 0), gy = (v) => v * s - (ax === 'y' ? k : 0);
      let x, y;
      if (a === 'TL') { x = gx(A); y = gy(B); }
      if (a === 'TR') { x = W - gx(A) - pw; y = gy(B); }
      if (a === 'BL') { x = gx(A); y = H - gy(B) - ph; }
      if (a === 'BR') { x = W - gx(A) - pw; y = H - gy(B) - ph; }
      if (a === 'L')  { x = gx(A); y = H / 2 + B * s - ph / 2; }
      if (a === 'R')  { x = W - gx(A) - pw; y = H / 2 + B * s - ph / 2; }
      if (a === 'T')  { x = W / 2 + A * s - pw / 2; y = gy(B); }
      if (a === 'B')  { x = W / 2 + A * s - pw / 2; y = H - gy(B) - ph; }
      const bx = rotBox(x, y, pw, ph, rot);
      return { x, y, bx, inside: inter(bx, { l: 0, t: 0, r: W, b: H }) / ((bx.r - bx.l) * (bx.b - bx.t)) };
    };
    // overlap with the keep-out: push outward along the shorter way (2 pt steps, max 60 pt), keeping ≥75% inside
    // the window and off the traffic lights; if no push clears it, the print is hidden
    const axes = a === 'L' || a === 'R' ? ['x'] : a === 'T' || a === 'B' ? ['y'] : ['x', 'y'];
    let P = place(0, 'x'), push = 0, dir = '';
    if (inter(P.bx, K) > 0) {
      search: for (let k = 2; k <= 60; k += 2) for (const d of axes) {
        const n = place(k, d);
        if (n.inside >= 0.75 && inter(n.bx, traffic) === 0 && inter(n.bx, K) === 0) { P = n; push = k; dir = d; break search; }
      }
    }
    const { x, y, bx, inside } = P;
    const ax = { TL: 0, BL: 0, L: 0, TR: W, BR: W, R: W, T: W / 2, B: W / 2 }[a];
    const ay = { TL: 0, TR: 0, T: 0, BL: H, BR: H, B: H, L: H / 2, R: H / 2 }[a];
    const p = els[i]; Object.assign(p.style, { left: x + 'px', top: y + 'px', width: pw + 'px', height: ph + 'px', transform: `rotate(${rot}deg)` });
    Object.assign(anchorDots[i].style, { left: ax + 'px', top: ay + 'px' });
    let why = '';
    if (tooSmall) why = '窗口过小';
    else if (inter(bx, K) > 0) why = '压到中央';
    else if (inside < 0.75) why = `只露出 ${Math.round(inside * 100)}%`;
    else if (inter(bx, traffic) > 0) why = '盖住红绿灯';
    p.classList.toggle('hidden', !!why);
    p.title = `#${i + 1} ${name} · ${a}` + (why ? ` · 隐藏：${why}` : '');
    if (why) out.push(`#${i + 1} ${name}（${a}）${why}`);
    else if (push) out.push(`#${i + 1} ${name}（${a}）外推 ${push} pt（${dir === 'x' ? '横向' : '纵向'}）`);
  });
  return { s, notes: out, hiddenCount: els.filter(e => e.classList.contains('hidden')).length };
}

// ---- render ----
const root = document.documentElement, h1 = document.getElementById('drop-h');
function fit(W, H) {
  const st = document.getElementById('stage').getBoundingClientRect();
  const z = Math.min(1, (st.width - 8) / W, (st.height - 8) / H);
  win.style.transform = `scale(${z})`;
  frame.style.width = W * z + 'px'; frame.style.height = H * z + 'px';
  return z;
}
function render() {
  const [W, H] = S.size.split('x').map(Number);
  root.className = [`theme-${S.appearance}`, S.drag === 'over' ? 'over' : '', S.motion === 'reduce' ? 'rm' : '',
                    S.transparency === 'reduce' ? 'rt' : '', S.guides === '1' ? 'guides' : ''].filter(Boolean).join(' ');
  root.style.setProperty('--print-opacity', OPACITY[S.appearance] / 100);
  const T = STR[S.lang]; root.lang = S.lang === 'en' ? 'en' : 'zh-CN';
  h1.textContent = S.drag === 'over' ? T.over : T.idle;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[e.dataset.t]; });
  win.style.width = W + 'px'; win.style.height = H + 'px';   // size first: the keep-out is measured from the laid-out centre
  const L = layout(W, H);
  document.querySelectorAll('.proto-bar .grp').forEach(g => g.querySelectorAll('button').forEach(b =>
    b.classList.toggle('on', S[g.dataset.k] === b.dataset.v)));
  const op = OPACITY[S.appearance], eff = S.drag === 'over' ? (S.transparency === 'reduce' ? 0 : Math.round(op * DIM)) : op;
  const shown = PRINTS.length - L.hiddenCount;
  document.getElementById('readout').innerHTML = [
    `appearance   <em>${S.appearance}</em>   print opacity <em>${eff}%</em>${S.drag === 'over' ? (S.transparency === 'reduce' ? ' (covered by opaque drop fill)' : ` (= ${op}% × 0.4)`) : ''}`,
    `drag         <em>${S.drag}</em>   ${S.drag === 'over' ? (S.motion === 'reduce' ? 'dim instant, no fan-out' : 'dim over 0.45 s, stack fans') : ''}`,
    `size         <em>${S.size}</em>   s = <em>${L.s.toFixed(2)}</em>   print <em>${Math.round(150 * L.s)}×${Math.round(110 * L.s)}</em>`,
    `prints shown <em>${shown}/${PRINTS.length}</em>   page zoom <span id="zoom"></span>`,
    `lang         <em>${S.lang}</em>   (draft English)`,
    `motion       <em>${S.motion}</em>   transparency <em>${S.transparency}</em>${S.transparency === 'reduce' ? ' (opaque chips/drop)' : ''}`,
    ...(L.notes.length ? L.notes.map(t => `<span class="hid">${t.includes('外推') ? 'pushed ' : 'hidden '} ${t}</span>`) : ['<span>hidden       none</span>']),
  ].join('\n');
  document.getElementById('rule-text').textContent = RULE;
  const z = fit(W, H);          // measure the stage after the readout has its final height
  document.getElementById('zoom').textContent = Math.round(z * 100) + '%';
  const p = new URLSearchParams();
  for (const k of ['appearance', 'drag', 'size', 'motion', 'transparency', 'lang']) p.set(k, S[k]);
  if (S.guides === '1') p.set('guides', '1');
  history.replaceState(null, '', '?' + p);
}
document.querySelectorAll('.proto-bar .grp').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => {
  const k = g.dataset.k; S[k] = (k === 'guides') ? (S.guides === '1' ? '0' : '1') : b.dataset.v; render();
}));
// ← / → cycle window sizes
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  const i = OPTS.size.indexOf(S.size), n = OPTS.size.length;
  if (e.key === 'ArrowLeft') { S.size = OPTS.size[(i - 1 + n) % n]; render(); }
  if (e.key === 'ArrowRight') { S.size = OPTS.size[(i + 1) % n]; render(); }
});
window.addEventListener('resize', render);
// a real drag over the window also flips the state
const drop = document.getElementById('drop'), toast = document.getElementById('toast'); let tt;
const say = m => { toast.textContent = m; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 1800); };
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); if (S.drag !== 'over') { S.drag = 'over'; render(); } }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); S.drag = 'idle'; render(); if (ev === 'drop') say('（原型）打开拖入的文件夹'); }));
document.getElementById('open').onclick = () => say('（原型）弹出系统“打开”面板，由你选择文件夹');
render();
</script>
