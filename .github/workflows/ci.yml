name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Heavy lanes run here instead of on the Mac mini: `gh workflow run CI --ref <branch>`.
  workflow_dispatch:
    inputs:
      swift_filter:
        description: Optional `swift test --filter` pattern; empty runs the whole package suite
        required: false
        default: ''
      app_tests:
        description: Also build and run the App test bundle
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  walking-skeleton:
    name: Walking skeleton
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check generated feature ledger HTML
        run: node scripts/ledger/build.mjs --check
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: Swift Testing
        env:
          SWIFT_FILTER: ${{ inputs.swift_filter }}
        run: swift test --package-path Packages/PicseeKit ${SWIFT_FILTER:+--filter "$SWIFT_FILTER"}
      - name: Build unsigned app
        run: xcodebuild build -scheme Picsee -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build/dd-ci

  app-tests:
    name: App tests
    if: github.event_name != 'workflow_dispatch' || inputs.app_tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: Build App tests
        run: xcodebuild build-for-testing -scheme Picsee -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build/dd-ci
      - name: Run App tests
        # The runner is the only job on its machine, so the local heavy lock is not needed.
        env:
          PICSEE_HEAVY_LOCK_HELD: '1'
        run: node scripts/tdd/app-lane.mjs

  pr-body-lint:
    name: PR body Gates
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541dca16ce9ac0c48b7c7840b0e47b # v4.4.0
        with:
          node-version: 22
      - name: Test agent tooling
        run: node --test scripts/agents/*.test.mjs
      - name: Check PR body gates
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/agents/ui-parity-pr-body-lint.mjs --base origin/main --body-file "$RUNNER_TEMP/pr-body.md"
