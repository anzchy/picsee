name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Heavy lanes run here instead of on the Mac mini: `gh workflow run CI --ref <branch>`.
  workflow_dispatch:
    inputs:
      swift_filter:
        description: Optional `swift test --filter` pattern; empty runs the whole package suite
        required: false
        default: ''
      app_tests:
        description: Also build and run the App test bundle
        type: boolean
        default: true
      cold:
        description: Build from scratch, without restoring the SwiftPM or DerivedData cache
        type: boolean
        default: false

# A pull request keeps one group per PR and cancels its older runs. Every push to main and every dispatch gets a group
# of its own (the run id): a shared group would let GitHub replace an older pending main run, leaving that commit
# without CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the native (macOS) jobs run. Only a pull request whose complete changed-file list is inside the
  # reviewed documentation/agent allowlist in scripts/ci/native-inputs.mjs skips them; any doubt, and every push or
  # dispatch, runs everything. Walking skeleton still reports on every run.
  changes:
    name: Native inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.classify.outputs.native }}
    steps:
      # The classifier comes from the base commit, so a pull request cannot loosen the rule that judges it.
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f trusted/scripts/ci/native-inputs.mjs ]; then
            node trusted/scripts/ci/native-inputs.mjs
          else
            echo 'native-inputs: base has no classifier; running native jobs'
            echo 'native=true' >> "$GITHUB_OUTPUT"
          fi

  # The package suite runs as two processes (#391): the non-UI targets, and MadoMacUITests one test at a time,
  # because its window tests saturate the runner's main actor when Swift Testing runs them in parallel. Each run is
  # wrapped in scripts/ci/test-watchdog.mjs and the logs, xunit results and stacks are uploaded even when the job fails.
  # Watchdog margin, against timeout-minutes: 30 (1800 s): the deadline is JOB_STARTED + 1560 s (or 1500 s after the
  # step starts, if earlier), leaving 240 s: at most 90 s of capture (--capture-seconds default: ps, then `sample`, then
  # `spindump`, each call cut off at what is left), 15 s TERM grace, KILL, and about 130 s for the upload.
  package-tests:
    name: Package tests (non-UI)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record job start
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Watchdog script tests
        run: node --test scripts/ci/*.test.mjs
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: SwiftPM cache key
        id: spm-key
        env:
          MANIFEST: ${{ hashFiles('Packages/MadoKit/Package.swift', 'Packages/MadoKit/Package.resolved') }}
          INPUTS: ${{ hashFiles('Packages/MadoKit/Package.swift', 'Packages/MadoKit/Package.resolved', 'Packages/MadoKit/Sources/**', 'Packages/MadoKit/Tests/**') }}
        run: node scripts/ci/cache-key.mjs spm "$MANIFEST" "$INPUTS"
      - name: Restore SwiftPM build
        if: github.event_name != 'push' && !inputs.cold
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Packages/MadoKit/.build
          key: ${{ steps.spm-key.outputs.key }}
          restore-keys: ${{ steps.spm-key.outputs.prefix }}
      - name: Swift Testing (Core, Application, Infrastructure)
        env:
          SWIFT_FILTER: ${{ inputs.swift_filter }}
        run: >-
          node scripts/ci/test-watchdog.mjs --out ci-logs/package-tests --timeout-seconds 1500
          --deadline-epoch $((JOB_STARTED + 1560)) --
          swift test --package-path Packages/MadoKit --skip 'MadoMacUITests\.' -Xswiftc -enable-incremental-file-hashing
          --xunit-output ci-logs/package-tests/xunit.xml ${SWIFT_FILTER:+--filter "$SWIFT_FILTER"}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-tests-logs
          path: ci-logs/package-tests
          if-no-files-found: warn
      # Only a passing main build seeds the cache; pull requests restore it and never save.
      - name: Save SwiftPM build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Packages/MadoKit/.build
          key: ${{ steps.spm-key.outputs.key }}

  package-macui-tests:
    name: Package tests (MacUI)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Record job start
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: SwiftPM cache key
        id: spm-key
        env:
          MANIFEST: ${{ hashFiles('Packages/MadoKit/Package.swift', 'Packages/MadoKit/Package.resolved') }}
          INPUTS: ${{ hashFiles('Packages/MadoKit/Package.swift', 'Packages/MadoKit/Package.resolved', 'Packages/MadoKit/Sources/**', 'Packages/MadoKit/Tests/**') }}
        run: node scripts/ci/cache-key.mjs spm "$MANIFEST" "$INPUTS"
      - name: Restore SwiftPM build
        if: github.event_name != 'push' && !inputs.cold
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Packages/MadoKit/.build
          key: ${{ steps.spm-key.outputs.key }}
          restore-keys: ${{ steps.spm-key.outputs.prefix }}
      - name: Swift Testing (MacUI, serial)
        env:
          SWIFT_FILTER: ${{ inputs.swift_filter }}
        run: >-
          node scripts/ci/test-watchdog.mjs --out ci-logs/package-macui-tests --timeout-seconds 1500
          --deadline-epoch $((JOB_STARTED + 1560)) --
          swift test --package-path Packages/MadoKit --no-parallel -Xswiftc -enable-incremental-file-hashing
          --skip '(MadoCoreTests|MadoApplicationTests|MadoInfrastructureTests)\.'
          --xunit-output ci-logs/package-macui-tests/xunit.xml ${SWIFT_FILTER:+--filter "$SWIFT_FILTER"}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-macui-tests-logs
          path: ci-logs/package-macui-tests
          if-no-files-found: warn

  # The generated-ledger check is plain Node, so it runs on Ubuntu; Walking skeleton requires it on every event.
  ledger-check:
    name: Ledger HTML check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test identity checks
        run: node --test scripts/name-checks/*.test.mjs scripts/ci/name-checks-ci.test.mjs
      - name: Check tracked code identity
        run: node scripts/name-checks/code-name.mjs
      - name: Check generated feature ledger HTML
        run: node scripts/ledger/build.mjs --check

  # One macOS job builds the unsigned app and then the App tests: build-for-testing builds MadoApp as well, so a
  # separate unsigned-build job duplicated that work and took a fourth macOS slot. The unsigned build runs in its own
  # step, using incremental-file-hashing to detect changed files, followed by the built-product identity check.
  # Walking skeleton requires both to succeed through that step's outcome; independent App-test failures remain allowed.
  # A dispatch with app_tests=false runs only the Build unsigned app step.
  app-tests:
    name: App tests
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      unsigned_build: ${{ steps.unsigned-build.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: DerivedData cache key
        id: dd-key
        env:
          MANIFEST: ${{ hashFiles('project.yml', '.github/actions/xcode-setup/action.yml', 'Packages/MadoKit/Package.swift', 'Packages/MadoKit/Package.resolved') }}
          INPUTS: ${{ hashFiles('project.yml', '.github/actions/xcode-setup/action.yml', 'Packages/MadoKit/Package.swift', 'Packages/MadoKit/Package.resolved', 'App/**', 'AppTests/**', 'Packages/MadoKit/Sources/**') }}
        run: node scripts/ci/cache-key.mjs dd "$MANIFEST" "$INPUTS"
      - name: Restore DerivedData
        if: github.event_name != 'push' && !inputs.cold
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build/dd-ci
          key: ${{ steps.dd-key.outputs.key }}
          restore-keys: ${{ steps.dd-key.outputs.prefix }}
      - name: Build unsigned app
        id: unsigned-build
        # Keep product identity in this outcome: Walking skeleton allows independent App-test failures.
        run: |
          xcodebuild build -scheme Mado -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build/dd-ci 'OTHER_SWIFT_FLAGS=$(inherited) -enable-incremental-file-hashing'
          node scripts/name-checks/built-product.mjs .build/dd-ci/Build/Products/Debug/Mado.app --entitlements App/Resources/Mado.entitlements
      - name: Build App tests
        if: github.event_name != 'workflow_dispatch' || inputs.app_tests
        run: xcodebuild build-for-testing -scheme Mado -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build/dd-ci 'OTHER_SWIFT_FLAGS=$(inherited) -enable-incremental-file-hashing'
      - name: Run App tests
        if: github.event_name != 'workflow_dispatch' || inputs.app_tests
        # The runner is the only job on its machine, so the local heavy lock is not needed.
        env:
          PICSEE_HEAVY_LOCK_HELD: '1'
        run: node scripts/tdd/app-lane.mjs
      - name: Upload first App attempt
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-lane-attempt1
          path: .build/app-lane-attempt1.log
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Save DerivedData
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build/dd-ci
          key: ${{ steps.dd-key.outputs.key }}

  # The required check on main keeps its name. scripts/ci/walking-skeleton.mjs decides: the classifier and the ledger
  # check must have succeeded, and then either both package suites and the unsigned build step succeeded (and the App
  # tests job ended in success or failure), or the classifier found no native input and every native job skipped.
  # Like the classifier, the verdict comes from the base commit, so a pull request cannot loosen the rule that judges
  # it. A base without the script gets a stricter inline rule: every job and the build step succeeded, no skip.
  walking-skeleton:
    name: Walking skeleton
    if: always()
    needs: [changes, ledger-check, package-tests, package-macui-tests, app-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Require the ledger check, package tests and the unsigned build
        env:
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          LEDGER: ${{ needs.ledger-check.result }}
          PACKAGE: ${{ needs.package-tests.result }}
          MACUI: ${{ needs.package-macui-tests.result }}
          APP_JOB: ${{ needs.app-tests.result }}
          UNSIGNED_BUILD: ${{ needs.app-tests.outputs.unsigned_build }}
        run: |
          if [ -f trusted/scripts/ci/walking-skeleton.mjs ]; then
            node trusted/scripts/ci/walking-skeleton.mjs
          else
            echo "changes=$CHANGES native=$NATIVE ledger=$LEDGER package-tests=$PACKAGE package-macui-tests=$MACUI app-tests=$APP_JOB unsigned-build-step=${UNSIGNED_BUILD:-(none)}"
            if [ "$NATIVE" != true ]; then
              echo 'walking-skeleton: FAIL (strict fallback: base has no verdict script and native was not true)'
              exit 1
            fi
            for result in "$CHANGES" "$LEDGER" "$PACKAGE" "$MACUI" "$APP_JOB" "$UNSIGNED_BUILD"; do
              if [ "$result" != success ]; then
                echo 'walking-skeleton: FAIL (strict fallback: base has no verdict script and a job or the build step did not succeed)'
                exit 1
              fi
            done
            echo 'walking-skeleton: PASS (strict fallback: every job and the unsigned build step succeeded)'
          fi

  design-check:
    name: Design check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install pinned npm dev dependencies
        run: npm ci --ignore-scripts
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        if: github.event_name != 'push'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # Downloads Chromium only when the cache missed; the system packages are installed every time.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Save Playwright browsers
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Check design catalog and journeys
        run: npm run design:check
