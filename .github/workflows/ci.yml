name: CI
on:
  pull_request:
  push:
    branches: [main]
  # Heavy lanes run here instead of on the Mac mini: `gh workflow run CI --ref <branch>`.
  workflow_dispatch:
    inputs:
      swift_filter:
        description: Optional `swift test --filter` pattern; empty runs the whole package suite
        required: false
        default: ''
      app_tests:
        description: Also build and run the App test bundle
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  walking-skeleton:
    name: Walking skeleton
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check generated feature ledger HTML
        run: node scripts/ledger/build.mjs --check
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: Swift Testing
        env:
          SWIFT_FILTER: ${{ inputs.swift_filter }}
        run: swift test --package-path Packages/PicseeKit ${SWIFT_FILTER:+--filter "$SWIFT_FILTER"}
      - name: Build unsigned app
        run: xcodebuild build -scheme Picsee -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build/dd-ci

  app-tests:
    name: App tests
    if: github.event_name != 'workflow_dispatch' || inputs.app_tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Xcode
        uses: ./.github/actions/xcode-setup
      - name: Build App tests
        run: xcodebuild build-for-testing -scheme Picsee -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath .build/dd-ci
      - name: Run App tests
        # The runner is the only job on its machine, so the local heavy lock is not needed.
        env:
          PICSEE_HEAVY_LOCK_HELD: '1'
        run: node scripts/tdd/app-lane.mjs

  design-check:
    name: Design check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pinned npm dev dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check design catalog and journeys
        run: npm run design:check
