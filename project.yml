name: Picsee
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  PicseeKit:
    path: Packages/PicseeKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: GRT84NAK4T
    ENABLE_HARDENED_RUNTIME: YES
targets:
  PicseeApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Picsee.entitlements
    dependencies:
      - package: PicseeKit
        product: PicseeCore
      - package: PicseeKit
        product: PicseeApplication
      - package: PicseeKit
        product: PicseeInfrastructure
      - package: PicseeKit
        product: PicseeMacUI
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Picsee
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anzchy.picsee
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Picsee.entitlements
        # Git metadata lives outside a linked worktree; only this target's build script is unsandboxed.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Stamp build Git SHA
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -eu
          cd "$SRCROOT"
          sha=$(git rev-parse --short HEAD)
          if ! git diff --quiet HEAD --; then
            sha="$sha-dirty"
          fi
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if /usr/libexec/PlistBuddy -c "Print :PicseeGitSHA" "$plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :PicseeGitSHA $sha" "$plist"
          else
            /usr/libexec/PlistBuddy -c "Add :PicseeGitSHA string $sha" "$plist"
          fi
  PicseeAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App
        excludes:
          - PicseeApp.swift
          - Updates/SparkleUpdatePort.swift
          - Info.plist
          - Resources
      - path: AppTests
    dependencies:
      - package: PicseeKit
        product: PicseeCore
      - package: PicseeKit
        product: PicseeApplication
      - package: PicseeKit
        product: PicseeInfrastructure
      - package: PicseeKit
        product: PicseeMacUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anzchy.picsee.tests
        CODE_SIGNING_ALLOWED: NO
  PicseeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
      - path: TestAssets/synthetic/landscape-3x2.png
        buildPhase: resources
      - path: TestAssets/synthetic/portrait-2x3.png
        buildPhase: resources
      - path: TestAssets/synthetic/orientation-1.tiff
        buildPhase: resources
    dependencies:
      - target: PicseeApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anzchy.picsee.uitests
        TEST_TARGET_NAME: PicseeApp
schemes:
  Picsee:
    build:
      targets:
        PicseeApp: all
    test:
      targets:
        - PicseeAppTests
    run:
      config: Debug
  PicseeFixtureUI:
    build:
      targets:
        PicseeApp: all
        PicseeUITests: all
    test:
      targets:
        - PicseeUITests
    run:
      config: Debug
