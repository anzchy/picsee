name: Mado
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  MadoKit:
    path: Packages/MadoKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: GRT84NAK4T
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MadoApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Mado.entitlements
    dependencies:
      - package: MadoKit
        product: MadoCore
      - package: MadoKit
        product: MadoApplication
      - package: MadoKit
        product: MadoInfrastructure
      - package: MadoKit
        product: MadoMacUI
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Mado
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anzchy.mado
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/Mado.entitlements
        # Git metadata lives outside a linked worktree; only this target's build script is unsandboxed.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Stamp build Git SHA
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -eu
          cd "$SRCROOT"
          sha=$(git rev-parse --short HEAD)
          if ! git diff --quiet HEAD --; then
            sha="$sha-dirty"
          fi
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if /usr/libexec/PlistBuddy -c "Print :MadoGitSHA" "$plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :MadoGitSHA $sha" "$plist"
          else
            /usr/libexec/PlistBuddy -c "Add :MadoGitSHA string $sha" "$plist"
          fi
  MadoAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App
        excludes:
          - MadoApp.swift
          - Info.plist
          - Resources
      - path: AppTests
    dependencies:
      - package: MadoKit
        product: MadoCore
      - package: MadoKit
        product: MadoApplication
      - package: MadoKit
        product: MadoInfrastructure
      - package: MadoKit
        product: MadoMacUI
      - package: Sparkle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anzchy.mado.tests
        CODE_SIGNING_ALLOWED: NO
  MadoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
      - path: TestAssets/synthetic/landscape-3x2.png
        buildPhase: resources
      - path: TestAssets/synthetic/portrait-2x3.png
        buildPhase: resources
      - path: TestAssets/synthetic/orientation-1.tiff
        buildPhase: resources
    dependencies:
      - target: MadoApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anzchy.mado.uitests
        TEST_TARGET_NAME: MadoApp
schemes:
  Mado:
    build:
      targets:
        MadoApp: all
    test:
      targets:
        - MadoAppTests
    run:
      config: Debug
  MadoFixtureUI:
    build:
      targets:
        MadoApp: all
        MadoUITests: all
    test:
      targets:
        - MadoUITests
    run:
      config: Debug
